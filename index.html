<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NurseFlow Pro — JHN</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ══ VARIABLES ══ */
:root{
  --bg:#0d1117;--c1:#161b22;--c2:#1e2530;--c3:#252d3a;
  --br:#2d3748;--br2:#3d4f6e;
  --tx:#e6edf3;--mu:#8b949e;
  --bl:#58a6ff;--bl2:#1f6feb;--bl3:rgba(88,166,255,.1);
  --gn:#3fb950;--gn3:rgba(63,185,80,.1);
  --rd:#f85149;--rd3:rgba(248,81,73,.1);
  --am:#d29922;--am3:rgba(210,153,34,.1);
  --pu:#bc8cff;--pu3:rgba(188,140,255,.1);
  --sb:260px;--r:10px;
}
[data-theme=light]{
  --bg:#f6f8fa;--c1:#ffffff;--c2:#f0f3f7;--c3:#e8ecf0;
  --br:#d0d7de;--br2:#b0bec8;
  --tx:#1f2328;--mu:#636c76;
  --bl:#0969da;--bl2:#0550ae;--bl3:rgba(9,105,218,.08);
  --gn:#1a7f37;--gn3:rgba(26,127,55,.08);
  --rd:#cf222e;--rd3:rgba(207,34,46,.08);
  --am:#9a6700;--am3:rgba(154,103,0,.08);
  --pu:#8250df;--pu3:rgba(130,80,223,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

/* ══ LOGIN ══ */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#login.show{display:flex}
.login-card{background:var(--c1);border:1px solid var(--br);border-radius:16px;padding:40px 36px;width:100%;max-width:390px}
.login-logo{text-align:center;margin-bottom:28px}
.login-icon{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,var(--bl),var(--pu));display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px}
.login-title{font-size:20px;font-weight:800;margin-bottom:2px}
.login-sub{font-size:12px;color:var(--mu)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--mu);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:10px 13px;background:var(--c2);border:1.5px solid var(--br);border-radius:8px;color:var(--tx);font-family:'Tajawal',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--bl)}
.btn-login{width:100%;padding:11px;border:none;border-radius:8px;background:var(--bl);color:#fff;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .2s}
.btn-login:hover{background:var(--bl2)}
.btn-forgot{display:block;text-align:center;margin-top:10px;font-size:12px;color:var(--mu);cursor:pointer;text-decoration:underline;background:none;border:none;width:100%;font-family:'Tajawal',sans-serif}

/* ══ APP ══ */
#app{display:none;min-height:100vh}
#app.show{display:flex}
.sidebar{width:var(--sb);background:var(--c1);border-left:1px solid var(--br);display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;z-index:100;overflow-y:auto}
[dir=ltr] .sidebar{right:auto;left:0;border-left:none;border-right:1px solid var(--br)}
.sb-top{padding:16px 14px;border-bottom:1px solid var(--br)}
.sb-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sb-brand-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--bl),var(--pu));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sb-brand-name{font-size:14px;font-weight:800}
.sb-brand-sub{font-size:10px;color:var(--mu)}
.sb-user{background:var(--c2);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:9px}
.sb-avatar{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,var(--bl),var(--pu));color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:700;line-height:1.3}
.sb-urole{font-size:10px;color:var(--mu);text-transform:capitalize}
.sb-nav{flex:1;padding:8px 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mu);transition:all .15s;margin-bottom:1px;position:relative;border:none;background:none;width:100%;text-align:right;font-family:'Tajawal',sans-serif}
[dir=ltr] .nav-item{text-align:left}
.nav-item:hover{background:var(--c2);color:var(--tx)}
.nav-item.active{background:var(--bl3);color:var(--bl)}
.nav-badge{position:absolute;left:10px;top:50%;transform:translateY(-50%);min-width:17px;height:17px;background:var(--rd);color:#fff;border-radius:9px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px;display:none}
[dir=ltr] .nav-badge{left:auto;right:10px}
.nav-badge.show{display:flex}
.sb-bottom{padding:8px 8px;border-top:1px solid var(--br)}
.sb-btns{display:flex;gap:5px;margin-bottom:5px}
.sb-btn-sm{flex:1;padding:7px;border-radius:7px;border:1px solid var(--br);background:transparent;color:var(--mu);font-size:11px;cursor:pointer;transition:all .15s;font-family:'Tajawal',sans-serif}
.sb-btn-sm:hover{background:var(--c2);color:var(--tx)}
.btn-logout{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;color:var(--mu);width:100%;border:none;background:none;font-family:'Tajawal',sans-serif;text-align:right;transition:all .15s}
[dir=ltr] .btn-logout{text-align:left}
.btn-logout:hover{background:var(--rd3);color:var(--rd)}

/* ══ CONTENT ══ */
.main{flex:1;margin-right:var(--sb);min-height:100vh;display:flex;flex-direction:column}
[dir=ltr] .main{margin-right:0;margin-left:var(--sb)}
.topbar{padding:14px 24px;border-bottom:1px solid var(--br);background:var(--c1);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:16px;font-weight:800}
.page-wrap{padding:24px;flex:1}
.pg{display:none}.pg.on{display:block}
.deadline-bar{background:var(--am3);border-bottom:1px solid var(--am);padding:8px 24px;font-size:11px;font-weight:700;color:var(--am);display:none}
.deadline-bar.show{display:block}

/* ══ COMPONENTS ══ */
.card{background:var(--c1);border:1px solid var(--br);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat-box{background:var(--c2);border:1px solid var(--br);border-radius:8px;padding:14px;text-align:center}
.stat-num{font-size:24px;font-weight:800;margin-bottom:3px}
.stat-label{font-size:10px;color:var(--mu);font-weight:600;text-transform:uppercase}

/* ══ TABLE ══ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--br);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:9px 14px;text-align:right;font-size:10px;font-weight:700;color:var(--mu);background:var(--c2);border-bottom:1px solid var(--br);text-transform:uppercase;letter-spacing:.3px}
[dir=ltr] th{text-align:left}
td{padding:9px 14px;border-bottom:1px solid var(--br)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--c2)}

/* ══ CALENDAR ══ */
.cal-wrap{overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-head{text-align:center;padding:5px;font-size:9px;font-weight:700;color:var(--mu);background:var(--c2);letter-spacing:.5px}
.cal-cell{min-height:52px;padding:4px;border-radius:5px;background:var(--c2);border:1.5px solid transparent;cursor:pointer;transition:all .12s;position:relative}
.cal-cell:hover{border-color:var(--bl);background:var(--bl3)}
.cal-cell.today{border-color:var(--bl)}
.cal-cell.past{opacity:.5;cursor:default}
.cal-cell.off-day{background:var(--gn3)}
.cal-dn{font-size:9px;font-weight:700;color:var(--mu);margin-bottom:2px}
.cal-sh{font-size:8px;font-weight:700;padding:1px 3px;border-radius:3px;display:inline-block}
.sh-m{background:rgba(210,153,34,.2);color:var(--am)}
.sh-e{background:rgba(188,140,255,.2);color:var(--pu)}
.sh-n{background:rgba(88,166,255,.2);color:var(--bl)}
.sh-ld{background:rgba(210,153,34,.2);color:var(--am)}
.sh-ln{background:rgba(88,166,255,.2);color:var(--bl)}
.sh-off{background:rgba(63,185,80,.2);color:var(--gn)}
.sh-ol{background:rgba(248,81,73,.2);color:var(--rd)}

/* ══ MODAL ══ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:var(--c1);border:1px solid var(--br);border-radius:14px;padding:22px;min-width:300px;max-width:440px;width:90%}
.modal-title{font-size:15px;font-weight:800;margin-bottom:3px}
.modal-date{font-size:11px;color:var(--mu);margin-bottom:18px}
.shift-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}
.shift-opt{padding:12px;border-radius:8px;border:2px solid var(--br);cursor:pointer;text-align:center;font-size:12px;font-weight:700;transition:all .12s;background:none;color:var(--tx);font-family:'Tajawal',sans-serif;width:100%}
.shift-opt:hover{border-color:var(--bl);background:var(--bl3)}
.shift-opt.picked{border-color:var(--bl);background:var(--bl3);color:var(--bl)}
.shift-opt.full{opacity:.4;cursor:not-allowed}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{padding:8px 16px;border-radius:7px;border:1px solid var(--br);background:var(--c2);color:var(--tx);font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.btn-save{padding:8px 16px;border-radius:7px;border:none;background:var(--bl);color:#fff;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;cursor:pointer}

/* ══ FORM ══ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-field label{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.3px}
.form-control{padding:9px 11px;background:var(--c2);border:1.5px solid var(--br);border-radius:7px;color:var(--tx);font-family:'Tajawal',sans-serif;font-size:13px;outline:none;transition:border-color .2s;width:100%}
.form-control:focus{border-color:var(--bl)}

/* ══ BUTTONS ══ */
.btn{padding:9px 18px;border-radius:7px;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--bl);color:#fff}
.btn-ghost{background:var(--c2);color:var(--tx);border:1px solid var(--br)}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:6px}
.btn-danger{background:var(--rd3);color:var(--rd);border:1px solid var(--rd)}
.btn-success{background:var(--gn3);color:var(--gn);border:1px solid var(--gn)}
.btn-ai{background:linear-gradient(135deg,#6366f1,var(--pu));color:#fff}

/* ══ BADGES ══ */
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.pill-bl{background:var(--bl3);color:var(--bl)}
.pill-gn{background:var(--gn3);color:var(--gn)}
.pill-rd{background:var(--rd3);color:var(--rd)}
.pill-am{background:var(--am3);color:var(--am)}
.pill-pu{background:var(--pu3);color:var(--pu)}
.pill-mu{background:var(--c3);color:var(--mu)}

/* ══ ALERTS ══ */
.alert{padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:10px;border:1px solid}
.alert-info{background:var(--bl3);color:var(--bl);border-color:var(--bl)}
.alert-ok{background:var(--gn3);color:var(--gn);border-color:var(--gn)}
.alert-warn{background:var(--am3);color:var(--am);border-color:var(--am)}
.alert-err{background:var(--rd3);color:var(--rd);border-color:var(--rd)}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--c1);border:1px solid var(--br);border-radius:8px;padding:10px 18px;font-size:12px;font-weight:700;z-index:999;display:none;animation:fadeup .2s;pointer-events:none}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
#toast.t-ok{border-color:var(--gn);color:var(--gn)}
#toast.t-warn{border-color:var(--am);color:var(--am)}
#toast.t-err{border-color:var(--rd);color:var(--rd)}
#toast.t-info{border-color:var(--bl);color:var(--bl)}

/* ══ LOADER ══ */
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ NURSE ROW ══ */
.nrow{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--bl),var(--pu));color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ══ PAGE HEADER ══ */
.page-header{margin-bottom:20px}
.page-header h2{font-size:19px;font-weight:800}
.page-header p{font-size:12px;color:var(--mu);margin-top:2px}

/* ══ MONTH NAV ══ */
.month-nav{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.month-nav button{width:30px;height:30px;border-radius:7px;border:1px solid var(--br);background:var(--c2);color:var(--tx);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.month-nav span{font-size:14px;font-weight:800}

/* ══ MOBILE ══ */
.mob-toggle{display:none;position:fixed;bottom:18px;right:18px;z-index:150;width:44px;height:44px;border-radius:10px;border:none;background:var(--bl);color:#fff;font-size:18px;cursor:pointer;align-items:center;justify-content:center}
@media(max-width:768px){
  .sidebar{transform:translateX(260px)}
  [dir=ltr] .sidebar{transform:translateX(-260px)}
  .sidebar.open{transform:none}
  .main{margin-right:0!important;margin-left:0!important}
  .mob-toggle{display:flex}
  .form-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-icon">🏥</div>
      <div class="login-title">NurseFlow Pro</div>
      <div class="login-sub">شبكة الجبيل الصحية — نظام إدارة جداول التمريض</div>
    </div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="f-email" placeholder="nurse@jhn.med.sa" autocomplete="email">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="f-pass" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">دخول</button>
    <button class="btn-forgot" onclick="doForgot()">نسيت كلمة المرور؟</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <nav class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-brand">
        <div class="sb-brand-icon">🏥</div>
        <div>
          <div class="sb-brand-name">NurseFlow Pro</div>
          <div class="sb-brand-sub">JHN</div>
        </div>
      </div>
      <div class="sb-user">
        <div class="sb-avatar" id="u-av">?</div>
        <div>
          <div class="sb-uname" id="u-nm"></div>
          <div class="sb-urole" id="u-rl"></div>
        </div>
      </div>
    </div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-bottom">
      <div class="sb-btns">
        <button class="sb-btn-sm" id="btn-theme" onclick="toggleTheme()">🌙</button>
        <button class="sb-btn-sm" id="btn-lang" onclick="toggleLang()">EN</button>
      </div>
      <button class="btn-logout" onclick="doLogout()">🚪 <span id="txt-logout">خروج</span></button>
    </div>
  </nav>

  <div class="main">
    <div class="deadline-bar" id="deadline-bar"></div>
    <div class="topbar">
      <div class="topbar-title" id="page-title">الرئيسية</div>
      <div id="topbar-right"></div>
    </div>
    <div class="page-wrap">
      <div id="pg-dash" class="pg"></div>
      <div id="pg-my" class="pg"></div>
      <div id="pg-team" class="pg"></div>
      <div id="pg-swap" class="pg"></div>
      <div id="pg-review" class="pg"></div>
      <div id="pg-approve" class="pg"></div>
      <div id="pg-overview" class="pg"></div>
      <div id="pg-report" class="pg"></div>
      <div id="pg-admin" class="pg"></div>
      <div id="pg-staff" class="pg"></div>
      <div id="pg-roles" class="pg"></div>
      <div id="pg-mode" class="pg"></div>
      <div id="pg-leave" class="pg"></div>
      <div id="pg-ai" class="pg"></div>
    </div>
  </div>
</div>

<button class="mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<!-- SHIFT MODAL -->
<div class="overlay" id="shift-modal" onclick="if(event.target===this)closeShiftModal()">
  <div class="modal">
    <div class="modal-title">اختر الشفت</div>
    <div class="modal-date" id="modal-date"></div>
    <div class="shift-grid" id="shift-opts"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeShiftModal()">إلغاء</button>
      <button class="btn-save" onclick="saveShiftChoice()">حفظ</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,doc,getDoc,getDocs,setDoc,deleteDoc,addDoc,collection}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FB={apiKey:'AIzaSyDC2cmBlwZDoOdCJXgQ7dc9X6MBqmlMf5w',authDomain:'nurseflow-jhn.firebaseapp.com',projectId:'nurseflow-jhn',storageBucket:'nurseflow-jhn.firebasestorage.app',messagingSenderId:'1005946269057',appId:'1:1005946269057:web:42e579c1bbcb67d4d28c80'};
const app=initializeApp(FB),auth=getAuth(app),db=getFirestore(app);

// ── DB HELPERS ──
const fsGet=async(c,i)=>{const s=await getDoc(doc(db,c,i));return s.exists()?{id:s.id,...s.data()}:null};
const fsAll=async c=>{const s=await getDocs(collection(db,c));return s.docs.map(d=>({id:d.id,...d.data()}))};
const fsSave=async(c,i,d)=>setDoc(doc(db,c,i),d,{merge:true});
const fsAdd=async(c,d)=>addDoc(collection(db,c),d);
const fsDel=async(c,i)=>deleteDoc(doc(db,c,i));

// ── STATE ──
let ME=null,LANG=localStorage.getItem('nf-lang')||'ar',MONTH=new Date();
let ALL={p:{},s:{},d:{},st:{},lb:{},md:{},sw:[],lp:{}};
let selDay=null,selShift=null;

// ── LANG & THEME ──
const T=k=>LANG==='ar'?k[0]:k[1];
document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
document.documentElement.lang=LANG;
if(localStorage.getItem('nf-theme')==='light')document.documentElement.setAttribute('data-theme','light');

window.toggleTheme=()=>{
  const isL=document.documentElement.getAttribute('data-theme')==='light';
  if(isL){document.documentElement.removeAttribute('data-theme');localStorage.setItem('nf-theme','dark');document.getElementById('btn-theme').textContent='🌙';}
  else{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('nf-theme','light');document.getElementById('btn-theme').textContent='☀️';}
};
if(localStorage.getItem('nf-theme')==='light')document.getElementById('btn-theme').textContent='☀️';

window.toggleLang=()=>{

// ── TOAST ──
let _t;
const toast=(msg,type='info')=>{
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='';
  el.classList.add({ok:'t-ok',warn:'t-warn',err:'t-err',info:'t-info'}[type]||'t-info');
  el.style.display='block';
  clearTimeout(_t);_t=setTimeout(()=>el.style.display='none',3000);
};

// ── AUTH ──
window.doLogin=async()=>{
  const em=document.getElementById('f-email').value.trim().toLowerCase();
  const pw=document.getElementById('f-pass').value;
  if(!em||!pw){toast(T(['أدخل البيانات','Enter credentials']),'warn');return;}
  const btn=document.getElementById('btn-login');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  try{
    const c=await signInWithEmailAndPassword(auth,em,pw);
    await boot(c.user.uid);
  }catch(e){
    btn.disabled=false;btn.textContent=T(['دخول','Sign In']);
    toast(T(['بيانات خاطئة','Invalid credentials']),'err');
  }
};
window.doLogout=()=>signOut(auth);
window.doForgot=async()=>{
  const em=document.getElementById('f-email').value.trim().toLowerCase();
  if(!em){toast(T(['أدخل الإيميل','Enter email']),'warn');return;}
  try{await sendPasswordResetEmail(auth,em);toast(T(['تم الإرسال ✓','Sent ✓']),'ok');}
  catch(e){toast(e.message,'err');}
};

async function boot(uid){
  let p=await fsGet('user_profiles',uid);
  if(!p){
    const all=await fsAll('user_profiles'),u=auth.currentUser;
    p=all.find(x=>x.email&&u&&x.email.trim().toLowerCase()===u.email.toLowerCase());
    if(p)await fsSave('user_profiles',uid,{...p});
  }
  if(!p){
    toast(T(['البروفايل غير موجود','Profile not found']),'err');
    const b=document.getElementById('btn-login');
    if(b){b.disabled=false;b.textContent=T(['دخول','Sign In']);}
    return;
  }
  ME={id:uid,...p};
  await loadAll();
  showApp();
}

async function loadAll(){
  const[pr,sc,dp,st,lb,md,sw,lp]=await Promise.all([
    fsAll('user_profiles'),fsAll('schedules'),fsAll('departments'),
    fsAll('schedule_status'),fsAll('leave_balance'),fsAll('manager_departments'),
    fsAll('swap_requests'),fsAll('leave_plan')
  ]);
  ALL.p={};pr.forEach(x=>{ALL.p[x.id]=x;});
  ALL.s={};sc.forEach(x=>{if(!ALL.s[x.nurse_id])ALL.s[x.nurse_id]={};ALL.s[x.nurse_id][x.date]={shift:x.shift,flag:x.flag||null};});
  ALL.d={};dp.forEach(x=>{ALL.d[x.name]={m:x.cap_morning||99,e:x.cap_evening||99,n:x.cap_night||99,ld:x.cap_long_day||99,id:x.id};});
  ALL.st={};st.forEach(x=>{ALL.st[x.nurse_id]=x;});
  ALL.lb={};lb.forEach(x=>{ALL.lb[x.nurse_id]=x;});
  ALL.md={};md.forEach(x=>{if(!ALL.md[x.manager_id])ALL.md[x.manager_id]=[];ALL.md[x.manager_id].push(x.dept_name);});
  ALL.sw=sw;
  ALL.lp={};lp.forEach(x=>{if(!ALL.lp[x.nurse_id])ALL.lp[x.nurse_id]=[];ALL.lp[x.nurse_id].push(x);});
}

function buildNav(){
  const role=ME.role||'nurse';
  const items=PAGES[role]||PAGES.nurse;
  const nav=document.getElementById('sb-nav');
  nav.innerHTML=items.map(([icon,label,pg,badge])=>`
    <button class="nav-item" onclick="goPg('${pg}')" id="nav-${pg}">
      <span>${icon}</span>
      <span>${T(label)}</span>
      ${badge?`<span class="nav-badge" id="${badge}">0</span>`:''}
    </button>
  `).join('');
  goPg(items[0][2]);
}

window.goPg=function(id){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const pg=document.getElementById(id);
  const nav=document.getElementById('nav-'+id);
  if(pg)pg.classList.add('on');
  if(nav)nav.classList.add('active');
  // Set title
  const role=ME.role||'nurse';
  const pages=PAGES[role]||PAGES.nurse;
  const found=pages.find(p=>p[2]===id);
  if(found)document.getElementById('page-title').textContent=T(found[1]);
  render(id);
};

function render(id){
  if(!ME)return;
  switch(id){
    case'pg-dash':renderDash();break;
    case'pg-my':renderMy();break;
    case'pg-team':renderTeam();break;
    case'pg-review':renderReview();break;
    case'pg-approve':renderApprove();break;
    case'pg-overview':renderOverview();break;
    case'pg-report':renderReport();break;
    case'pg-admin':renderAdmin();break;
    case'pg-staff':renderStaff();break;
    case'pg-roles':renderRoles();break;
    case'pg-mode':renderMode();break;
    case'pg-leave':renderLeave();break;
    case'pg-ai':renderAI();break;
    case'pg-swap':renderSwap();break;
  }
}

// ── DEADLINE CHECK ──
function checkDeadline(){
  const now=new Date(),d=now.getDate(),m=now.getMonth(),y=now.getFullYear();
  const daysLeft=new Date(y,m+1,0).getDate()-d;
  const bar=document.getElementById('deadline-bar');
  if(ME.role==='nurse'&&daysLeft<=5){
    const st=ALL.st[ME.id];
    if(!st||st.status==='draft'){
      bar.textContent=T(['⚠️ تبقى '+daysLeft+' أيام لإغلاق الجدول!','⚠️ '+daysLeft+' days left to submit your schedule!']);
      bar.classList.add('show');
    }
  }
}

// ── HELPERS ──
const mN=m=>[T(['يناير','Jan']),T(['فبراير','Feb']),T(['مارس','Mar']),T(['أبريل','Apr']),T(['مايو','May']),T(['يونيو','Jun']),T(['يوليو','Jul']),T(['أغسطس','Aug']),T(['سبتمبر','Sep']),T(['أكتوبر','Oct']),T(['نوفمبر','Nov']),T(['ديسمبر','Dec'])][m];
const dayN=d=>[T(['أح','Su']),T(['إث','Mo']),T(['ثل','Tu']),T(['أر','We']),T(['خم','Th']),T(['جم','Fr']),T(['سب','Sa'])][d];
const shIcon={'morning':'🌅','evening':'🌆','night':'🌙','long_day':'☀️','long_night':'🌑','off':'🏖️','official':'🏛️','sick':'🤒','training':'📚'};
const shLabel=(s)=>({morning:T(['صباح','Morning']),evening:T(['مساء','Evening']),night:T(['ليل','Night']),long_day:T(['طويل ن','Long Day']),long_night:T(['طويل ل','Long Night']),off:T(['إجازة','Off']),official:T(['رسمي','Official']),sick:T(['مرضية','Sick']),training:T(['تدريب','Training'])})[s]||s;
const shClass={'morning':'sh-m','evening':'sh-e','night':'sh-n','long_day':'sh-ld','long_night':'sh-ln','off':'sh-off','official':'sh-ol'};
const stClass={'draft':'pill-mu','submitted':'pill-bl','reviewed':'pill-am','approved':'pill-gn','rejected':'pill-rd'};
const stLabel=s=>({draft:T(['مسودة','Draft']),submitted:T(['مُرسل','Submitted']),reviewed:T(['مُراجع','Reviewed']),approved:T(['موافق','Approved']),rejected:T(['مرفوض','Rejected'])})[s]||s;

function myNurses(){
  const nurses=Object.values(ALL.p).filter(p=>p.role==='nurse');
  if(ME.role==='head_nurse')return nurses.filter(n=>n.dept===ME.dept);
  if(ME.role==='manager'){const d=ALL.md[ME.id]||[];return nurses.filter(n=>d.includes(n.dept));}
  return nurses;
}
function shiftCount(dept,date,sh){return Object.values(ALL.p).filter(p=>p.role==='nurse'&&p.dept===dept).filter(n=>(ALL.s[n.id]||{})[date]?.shift===sh).length;}
function shiftCap(dept,sh){const d=ALL.d[dept];if(!d)return 99;return{morning:d.m,evening:d.e,night:d.n,long_day:d.ld||99}[sh]||99;}

  const rev=myNs.filter(n=>ALL.st[n.id]&&ALL.st[n.id].status==='submitted').length;
  const app=myNs.filter(n=>ALL.st[n.id]&&ALL.st[n.id].status==='reviewed').length;

    <div class="stat-box"><div class="stat-num">${myNs.length}</div><div class="stat-label">${T(['إجمالي الممرضات','Total Nurses'])}</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--am)">${rev}</div><div class="stat-label">${T(['بانتظار مراجعة','Pending Review'])}</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--bl)">${app}</div><div class="stat-label">${T(['بانتظار موافقة','Pending Approval'])}</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--gn)">${appr}</div><div class="stat-label">${T(['موافق عليها','Approved'])}</div></div>

    h+=`<div class="card"><div class="card-title">📋 ${T(['حالة الجداول','Schedule Status'])}</div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>${T(['الممرضة','Nurse'])}</th><th>${T(['القسم','Dept'])}</th><th>${T(['الحالة','Status'])}</th>
    </tr></thead><tbody>`;
    myNs.slice(0,10).forEach(n=>{

      h+=`<tr><td><div class="nrow"><div class="avatar">${n.name?n.name.slice(0,2):'?'}</div>${n.name||'-'}</div></td>

    });

}

// ── MY SCHEDULE ──
function renderMy(){
  const pg=document.getElementById('pg-my');if(!pg)return;
  const y=MONTH.getFullYear(),m=MONTH.getMonth();
  const days=new Date(y,m+1,0).getDate();
  const st=ALL.st[ME.id];
  const canEdit=!st||st.status==='draft';
  let h=`<div class="page-header"><h2>📅 ${T(['جدولي','My Schedule'])}</h2></div>`;
  // Submit button
  if(canEdit){
    h+=`<div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="submitSchedule()">${T(['إرسال الجدول','Submit Schedule'])}</button>
    </div>`;
  }else{
    h+=`<div class="alert alert-info" style="margin-bottom:14px">
      ${T(['الجدول مُرسل — الحالة:','Schedule submitted — Status:'])} <strong>${stLabel(st.status)}</strong>
    </div>`;
  }
  // Month nav
  h+=`<div class="month-nav">
    <button onclick="changeMonth(-1)">›</button>
    <span>${mN(m)} ${y}</span>
    <button onclick="changeMonth(1)">‹</button>
  </div>`;
  // Calendar
  h+=`<div class="cal-wrap"><div class="cal-grid">`;
  ['أح','إث','ثل','أر','خم','جم','سب'].forEach(d=>{h+=`<div class="cal-head">${LANG==='ar'?d:['Su','Mo','Tu','We','Th','Fr','Sa'][['أح','إث','ثل','أر','خم','جم','سب'].indexOf(d)]}</div>`;});
  const first=new Date(y,m,1).getDay();
  for(let i=0;i<first;i++)h+=`<div></div>`;
  const today=new Date();
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sh=(ALL.s[ME.id]||{})[ds];
    const isToday=today.getDate()===d&&today.getMonth()===m&&today.getFullYear()===y;
    const isPast=new Date(ds)<today&&!isToday;
    let cls='cal-cell';
    if(isToday)cls+=' today';
    if(isPast)cls+=' past';
    if(sh?.shift==='off')cls+=' off-day';
    const onclick=canEdit&&!isPast?`onclick="openShift('${ds}')"`:'' ;
    h+=`<div class="${cls}" ${onclick}>
      <div class="cal-dn">${d}</div>
      ${sh?`<div class="cal-sh ${shClass[sh.shift]||''}">${shLabel(sh.shift)}</div>`:''}
    </div>`;
  }
  h+=`</div></div>`;
  pg.innerHTML=h;
}

window.changeMonth=function(dir){
  MONTH=new Date(MONTH.getFullYear(),MONTH.getMonth()+dir,1);
  render(document.querySelector('.pg.on')?.id);
};

// ── SHIFT MODAL ──
window.openShift=function(ds){
  selDay=ds;selShift=null;
  document.getElementById('modal-date').textContent=ds;
  const cur=(ALL.s[ME.id]||{})[ds];
  const nurse=ALL.p[ME.id];
  const is12h=nurse?.shift_type==='12h';
  const shifts=is12h?['long_day','long_night','off']:['morning','evening','night','off'];
  let h='';
  shifts.forEach(s=>{
    const isFull=s!=='off'&&shiftCount(ME.dept,ds,s)>=shiftCap(ME.dept,s);
    h+=`<button class="shift-opt${cur?.shift===s?' picked':''}${isFull?' full':''}" onclick="pickShift('${s}')" ${isFull?'disabled':''}>
      ${shIcon[s]||''} ${shLabel(s)}${isFull?` (${T(['ممتلئ','Full'])})`:''}</button>`;
  });
  document.getElementById('shift-opts').innerHTML=h;
  document.getElementById('shift-modal').classList.add('show');
};
window.pickShift=function(s){
  selShift=s;
  document.querySelectorAll('.shift-opt').forEach(b=>b.classList.toggle('picked',b.textContent.trim().startsWith(shIcon[s]||(shLabel(s)[0]))));
  // simpler: toggle based on dataset
  document.querySelectorAll('.shift-opt').forEach((b,i)=>{
    const shifts=ALL.p[ME.id]?.shift_type==='12h'?['long_day','long_night','off']:['morning','evening','night','off'];
    b.classList.toggle('picked',shifts[i]===s);
  });
};
window.closeShiftModal=function(){document.getElementById('shift-modal').classList.remove('show');selDay=null;selShift=null;};
window.saveShiftChoice=async function(){
  if(!selDay||!selShift){toast(T(['اختر شفت','Choose a shift']),'warn');return;}
  await fsSave('schedules',ME.id+'_'+selDay,{nurse_id:ME.id,date:selDay,shift:selShift,flag:null});
  if(!ALL.s[ME.id])ALL.s[ME.id]={};
  ALL.s[ME.id][selDay]={shift:selShift,flag:null};
  closeShiftModal();
  toast(T(['تم الحفظ ✓','Saved ✓']),'ok');
  renderMy();
};

  pg.innerHTML=h;

// ── APPROVE (Manager) ──
function renderApprove(){
  const pg=document.getElementById('pg-approve');if(!pg)return;
  const myDepts=ALL.md[ME.id]||[];
  const nurses=Object.values(ALL.p).filter(p=>{
    if(p.role!=='nurse')return false;
    if(ME.role==='admin')return true;
    return myDepts.includes(p.dept);
  }).filter(n=>ALL.st[n.id]?.status==='reviewed');
  const badge=document.getElementById('badge-approve');
  if(badge){badge.textContent=nurses.length;badge.classList.toggle('show',nurses.length>0);}
  let h=`<div class="page-header"><h2>✅ ${T(['الموافقة النهائية','Final Approval'])}</h2></div>`;
  if(!nurses.length){h+=`<div class="alert alert-info">${T(['لا يوجد جداول للموافقة','No schedules pending approval'])}</div>`;pg.innerHTML=h;return;}
  h+=`<div class="tbl-wrap"><table><thead><tr>
    <th>${T(['الممرضة','Nurse'])}</th><th>${T(['القسم','Dept'])}</th><th></th>
  </tr></thead><tbody>`;
  nurses.forEach(n=>{
    h+=`<tr>
      <td><div class="nrow"><div class="avatar">${n.name?n.name.slice(0,2):'?'}</div>${n.name}</div></td>
      <td>${n.dept||'-'}</td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-success btn-sm" onclick="approveOk('${n.id}')">${T(['موافقة','Approve'])}</button>
          <button class="btn btn-danger btn-sm" onclick="approveNo('${n.id}')">${T(['رفض','Reject'])}</button>
        </div>
      </td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  pg.innerHTML=h;
}
window.approveOk=async function(uid){
  await fsSave('schedule_status',uid,{status:'approved',approved_by:ME.id,approved_at:new Date().toISOString()});
  ALL.st[uid]={...ALL.st[uid],status:'approved'};
  toast(T(['تمت الموافقة ✓','Approved ✓']),'ok');renderApprove();
};
window.approveNo=async function(uid){
  const note=prompt(T(['سبب الرفض (اختياري)','Reason (optional)']));
  await fsSave('schedule_status',uid,{status:'rejected',approved_by:ME.id,notes:note||null});
  ALL.st[uid]={...ALL.st[uid],status:'rejected'};
  toast(T(['تم الرفض','Rejected']),'warn');renderApprove();
};

// ── OVERVIEW ──
function renderOverview(){
  const pg=document.getElementById('pg-overview');if(!pg)return;
  const y=MONTH.getFullYear(),m=MONTH.getMonth(),days=new Date(y,m+1,0).getDate();
  let h=`<div class="page-header"><h2>🗂️ ${T(['التغطية','Coverage'])}</h2></div>`;
  h+=`<div class="month-nav"><button onclick="changeMonth(-1)">›</button><span>${mN(m)} ${y}</span><button onclick="changeMonth(1)">‹</button></div>`;
  Object.keys(ALL.d).forEach(dept=>{
    h+=`<div class="card"><div class="card-title">🏥 ${dept}</div>`;
    h+=`<div class="cal-wrap"><table style="min-width:700px"><thead><tr><th>${T(['يوم','Day'])}</th>`;
    ['morning','evening','night'].forEach(sh=>h+=`<th>${shLabel(sh)}</th>`);
    h+=`</tr></thead><tbody>`;
    for(let d=1;d<=7;d++){
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dt=new Date(y,m,d);
      h+=`<tr><td>${d} ${dayN(dt.getDay())}</td>`;
      ['morning','evening','night'].forEach(sh=>{
        const cnt=shiftCount(dept,ds,sh);
        const cap=shiftCap(dept,sh);
        const color=cnt>=cap?'var(--gn)':cnt>0?'var(--am)':'var(--rd)';
        h+=`<td style="color:${color};font-weight:700;text-align:center">${cnt}/${cap<99?cap:'∞'}</td>`;
      });
      h+=`</tr>`;
    }
    h+=`</tbody></table></div></div>`;
  });
  pg.innerHTML=h;
}

// ── REPORT ──
function renderReport(){
  const pg=document.getElementById('pg-report');if(!pg)return;
  const nurses=myNurses();
  const y=MONTH.getFullYear(),m=MONTH.getMonth();
  let h=`<div class="page-header"><h2>📈 ${T(['التقرير','Report'])}</h2></div>`;
  h+=`<div class="month-nav"><button onclick="changeMonth(-1)">›</button><span>${mN(m)} ${y}</span><button onclick="changeMonth(1)">‹</button></div>`;
  h+=`<div class="tbl-wrap"><table><thead><tr>
    <th>${T(['الممرضة','Nurse'])}</th><th>${T(['القسم','Dept'])}</th>
    <th>${T(['صباح','Morning'])}</th><th>${T(['مساء','Evening'])}</th><th>${T(['ليل','Night'])}</th>
    <th>${T(['إجازة','Off'])}</th><th>${T(['الحالة','Status'])}</th>
  </tr></thead><tbody>`;
  nurses.forEach(n=>{
    const sched=ALL.s[n.id]||{};
    const entries=Object.entries(sched).filter(([k])=>{const d=new Date(k+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m;});
    const cnt=(sh)=>entries.filter(([,v])=>v.shift===sh).length;
    h+=`<tr>
      <td><div class="nrow"><div class="avatar">${n.name?n.name.slice(0,2):'?'}</div>${n.name}</div></td>
      <td>${n.dept||'-'}</td>
      <td style="text-align:center">${cnt('morning')+cnt('long_day')}</td>
      <td style="text-align:center">${cnt('evening')}</td>
      <td style="text-align:center">${cnt('night')+cnt('long_night')}</td>
      <td style="text-align:center">${cnt('off')}</td>
      <td><span class="pill ${stClass[ALL.st[n.id]?.status||'draft']}">${stLabel(ALL.st[n.id]?.status||'draft')}</span></td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  pg.innerHTML=h;
}

  <div class="form-grid">
    <div class="form-field"><label>${T(['اسم القسم','Name'])}</label><input id="dept-name" class="form-control" placeholder="ICU"></div>
    <div class="form-field"><label>${T(['حد الصباح','Morning Cap'])}</label><input id="dept-m" type="number" class="form-control" value="3" min="0"></div>
    <div class="form-field"><label>${T(['حد المساء','Evening Cap'])}</label><input id="dept-e" type="number" class="form-control" value="3" min="0"></div>
    <div class="form-field"><label>${T(['حد الليل','Night Cap'])}</label><input id="dept-n" type="number" class="form-control" value="3" min="0"></div>

    h+=`<div class="card"><div class="card-title">📋 ${T(['الأقسام الحالية','Current Departments'])}</div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>${T(['القسم','Dept'])}</th><th>${T(['صباح','M'])}</th><th>${T(['مساء','E'])}</th><th>${T(['ليل','N'])}</th><th></th>
    </tr></thead><tbody>`;
    depts.forEach(name=>{
      const d=ALL.d[name];
      h+=`<tr><td>${name}</td><td>${d.m}</td><td>${d.e}</td><td>${d.n}</td>
        <td><button class="btn btn-danger btn-sm" onclick="delDept('${name}')">${T(['حذف','Delete'])}</button></td></tr>`;
    });
    h+=`</tbody></table></div></div>`;
  }
  // Manager-dept assignments
  const managers=Object.values(ALL.p).filter(p=>p.role==='manager');
  if(managers.length){
    h+=`<div class="card"><div class="card-title">👔 ${T(['تعيين المدراء','Manager Assignments'])}</div>`;
    managers.forEach(mgr=>{
      const assigned=ALL.md[mgr.id]||[];
      h+=`<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;margin-bottom:8px">${mgr.name}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">`;
      depts.forEach(dept=>{
        const on=assigned.includes(dept);
        h+=`<button data-mgr="${mgr.id}" data-dept="${dept}" onclick="toggleMgrDept(this)" class="btn ${on?'btn-primary':'btn-ghost'} btn-sm">${dept}</button>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div>`;
  }
  pg.innerHTML=h;
}
window.addDept=async function(){
  const name=document.getElementById('dept-name').value.trim();
  const m=+document.getElementById('dept-m').value||3;
  const e=+document.getElementById('dept-e').value||3;
  const n=+document.getElementById('dept-n').value||3;
  if(!name){toast(T(['أدخل اسم القسم','Enter dept name']),'warn');return;}
  await fsAdd('departments',{name,cap_morning:m,cap_evening:e,cap_night:n,cap_long_day:m});
  ALL.d[name]={m,e,n,ld:m};
  toast(T(['تم الإضافة ✓','Added ✓']),'ok');renderAdmin();
};
window.delDept=async function(name){
  if(!confirm(T(['حذف '+name+'؟','Delete '+name+'?'])))return;
  const did=ALL.d[name]?.id;
  if(did)await fsDel('departments',did);
  delete ALL.d[name];
  toast(T(['تم الحذف','Deleted']),'ok');renderAdmin();
};
window.toggleMgrDept=async function(btn){
  const mgrId=btn.dataset.mgr,dept=btn.dataset.dept;
  const assigned=ALL.md[mgrId]||[];
  const isOn=assigned.includes(dept);
  if(isOn){
    const all=await fsAll('manager_departments');
    const row=all.find(r=>r.manager_id===mgrId&&r.dept_name===dept);
    if(row)await fsDel('manager_departments',row.id);
    ALL.md[mgrId]=(ALL.md[mgrId]||[]).filter(d=>d!==dept);
  }else{
    await fsAdd('manager_departments',{manager_id:mgrId,dept_name:dept});
    if(!ALL.md[mgrId])ALL.md[mgrId]=[];
    ALL.md[mgrId].push(dept);
  }
  toast(T(['تم التحديث ✓','Updated ✓']),'ok');renderAdmin();
};

window.addStaff=async function(){
  const name=document.getElementById('s-name').value.trim();
  const email=document.getElementById('s-email').value.trim().toLowerCase();
  const pass=document.getElementById('s-pass').value;
  const role=document.getElementById('s-role').value;
  const dept=document.getElementById('s-dept').value;
  const hrs=document.getElementById('s-hrs').value;
  if(!name||!email||!pass){toast(T(['أدخلي جميع البيانات','Fill all fields']),'warn');return;}
  if(pass.length<6){toast(T(['كلمة المرور 6 أحرف على الأقل','Min 6 chars']),'warn');return;}
  const btn=document.getElementById('btn-add-staff'),res=document.getElementById('add-result');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  try{
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyDC2cmBlwZDoOdCJXgQ7dc9X6MBqmlMf5w',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,returnSecureToken:true})});
    const d=await r.json();
    if(d.error){let m=d.error.message;if(m==='EMAIL_EXISTS')m=T(['الإيميل مستخدم','Email exists']);throw new Error(m);}
    await fsSave('user_profiles',d.localId,{name,email,role,dept,shift_type:hrs,created_by:ME.id,created_at:new Date().toISOString()});
    ALL.p[d.localId]={id:d.localId,name,email,role,dept,shift_type:hrs};
    ['s-name','s-email','s-pass'].forEach(i=>document.getElementById(i).value='');
    res.innerHTML=`<div class="alert alert-ok">✅ ${T(['تم إضافة ','Added ']+name)}</div>`;
    toast(T(['تم ✓','Added ✓']),'ok');renderStaff();
  }catch(e){res.innerHTML=`<div class="alert alert-err">❌ ${e.message}</div>`;toast(e.message,'err');}
  finally{btn.disabled=false;btn.textContent=T(['➕ إضافة','➕ Add']);}
};
window.saveStaff=async function(uid){
  const r=document.getElementById('es-r-'+uid),d=document.getElementById('es-d-'+uid),s=document.getElementById('es-s-'+uid);
  if(!r||!d)return;
  const upd={role:r.value,dept:d.value.trim(),shift_type:s?s.value:''};
  await fsSave('user_profiles',uid,upd);
  if(ALL.p[uid])Object.assign(ALL.p[uid],upd);
  toast(T(['تم الحفظ ✓','Saved ✓']),'ok');
};

window.bulkUpload=async function(input){
  const file=input.files[0];if(!file)return;
  const res=document.getElementById('bulk-result');
  res.innerHTML=`<div class="alert alert-info">${T(['جارٍ المعالجة...','Processing...'])}</div>`;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
      const valid=rows.slice(1).filter(r=>r[0]&&r[1]&&r[2]);
      if(!valid.length){toast(T(['الملف فارغ','Empty file']),'warn');return;}
      let ok=0;const errs=[];
      for(let i=0;i<valid.length;i++){
        const[rn,re,rp,rr='nurse',rd='',rs='']=valid[i].map(String);
        res.innerHTML=`<div class="alert alert-info">${i+1}/${valid.length}: ${rn.trim()}</div>`;
        try{
          const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyDC2cmBlwZDoOdCJXgQ7dc9X6MBqmlMf5w',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:re.trim().toLowerCase(),password:rp.trim(),returnSecureToken:true})});
          const dd=await r.json();if(dd.error)throw new Error(dd.error.message);
          await fsSave('user_profiles',dd.localId,{name:rn.trim(),email:re.trim().toLowerCase(),role:rr.trim(),dept:rd.trim(),shift_type:rs.trim(),created_by:ME.id,created_at:new Date().toISOString()});
          ALL.p[dd.localId]={id:dd.localId,name:rn.trim(),email:re.trim().toLowerCase(),role:rr.trim(),dept:rd.trim(),shift_type:rs.trim()};
          ok++;
        }catch(err){errs.push(`${rn}: ${err.message}`);}
      }
      let rh=`<div class="alert alert-ok">✅ ${ok} ${T(['تم إضافتهم','added')}</div>`;
      if(errs.length)rh+=`<div class="alert alert-err">❌ ${errs.join(' | ')}</div>`;
      res.innerHTML=rh;renderStaff();
    }catch(err){res.innerHTML=`<div class="alert alert-err">❌ ${err.message}</div>`;}
  };
  reader.readAsArrayBuffer(file);
};

// ── AI FILL LATE ──
window.aiFill=async function(dept){
  const nurses=Object.values(ALL.p).filter(p=>p.role==='nurse'&&p.dept===dept&&(!ALL.st[p.id]||ALL.st[p.id].status==='draft'));
  if(!nurses.length){toast(T(['لا يوجد متأخرات','No late nurses']),'info');return;}
  const y=MONTH.getFullYear(),m=MONTH.getMonth(),days=new Date(y,m+1,0).getDate();
  const dc=ALL.d[dept]||{m:3,e:3,n:3};
  toast(T(['AI يعمل...','AI working...']),'info');
  const prompt=`Fill ${days}-day schedule for ${nurses.length} nurses in ${dept}. Nurses: ${nurses.map(n=>n.name+(n.shift_type?` (${n.shift_type})`:'')  ).join(', ')}. Daily needs: morning=${dc.m}, evening=${dc.e}, night=${dc.n}. Min 6 rest days/month. 12h nurses: long_day or long_night only. 9h nurses: morning/evening/night. Return ONLY valid JSON: {"schedule":{"NurseName":{"1":"morning","2":"off",...}},"summary":"brief Arabic summary"}`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,messages:[{role:'user',content:prompt}]})});
    const data=await r.json();
    const text=data.content?.[0]?.text||'';
    const match=text.match(/\{[\s\S]*\}/);if(!match)throw new Error('Invalid AI response');
    const result=JSON.parse(match[0]);
    let count=0;
    for(const nurse of nurses){
      const sh=result.schedule?.[nurse.name];if(!sh)continue;
      for(let d=1;d<=days;d++){
        const shift=sh[String(d)];if(!shift||shift==='off')continue;
        const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        await fsSave('schedules',nurse.id+'_'+ds,{nurse_id:nurse.id,date:ds,shift,flag:null});
        if(!ALL.s[nurse.id])ALL.s[nurse.id]={};
        ALL.s[nurse.id][ds]={shift,flag:null};count++;
      }
      await fsSave('schedule_status',nurse.id,{nurse_id:nurse.id,status:'submitted',submitted_at:new Date().toISOString(),auto_filled:true});
      ALL.st[nurse.id]={nurse_id:nurse.id,status:'submitted',auto_filled:true};
    }
    const div=document.getElementById('mode-r-'+dept.replace(/\s/g,'_'));
    if(div)div.innerHTML=`<div class="alert alert-ok" style="margin-top:10px">✅ ${result.summary||T(['تم التعبئة التلقائية','Auto-filled'])} (${count} ${T(['يوم','days'])})</div>`;
    toast(T(['تم التعبئة ✓','Auto-filled ✓']),'ok');
  }catch(e){toast(e.message,'err');}
};

// ── AI SUGGESTIONS ──
window.aiSuggest=async function(dept){
  const y=MONTH.getFullYear(),m=MONTH.getMonth(),days=new Date(y,m+1,0).getDate();
  const dc=ALL.d[dept]||{m:3,e:3,n:3};
  const nurses=Object.values(ALL.p).filter(p=>p.role==='nurse'&&p.dept===dept);
  const gaps=[];
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    for(const sh of['morning','evening','night']){
      const cur=shiftCount(dept,ds,sh),cap=shiftCap(dept,sh);
      if(cap<99&&cur<cap)gaps.push({date:ds,shift:sh,have:cur,need:cap});
    }
  }
  const div=document.getElementById('mode-r-'+dept.replace(/\s/g,'_'));
  if(!gaps.length){if(div)div.innerHTML=`<div class="alert alert-ok" style="margin-top:10px">✅ ${T(['التغطية مكتملة','Coverage complete'])}</div>`;return;}
  toast(T(['AI يحلل...','Analyzing...']),'info');
  const schedSummary=nurses.slice(0,10).map(n=>`${n.name}: ${Object.entries(ALL.s[n.id]||{}).filter(([k])=>{const dt=new Date(k+'T00:00:00');return dt.getFullYear()===y&&dt.getMonth()===m;}).slice(0,5).map(([k,v])=>`${k.slice(8)}:${v.shift}`).join(',')}`).join('; ');
  const prompt=`Coverage gaps in ${dept}: ${JSON.stringify(gaps.slice(0,15))}. Nurses: ${schedSummary}. Suggest specific changes. Return ONLY JSON: {"suggestions":[{"nurse":"name","date":"YYYY-MM-DD","from":"shift","to":"newshift","reason":"why"}],"summary":"Arabic summary"}`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:prompt}]})});
    const data=await r.json();
    const text=data.content?.[0]?.text||'';
    const match=text.match(/\{[\s\S]*\}/);if(!match)throw new Error('Invalid AI response');
    const result=JSON.parse(match[0]);
    window._sug=window._sug||{};window._sug[dept]=result.suggestions||[];
    let rh=`<div class="card" style="margin-top:10px"><div class="card-title">✨ AI Suggestions</div>`;
    if(result.summary)rh+=`<div class="alert alert-info" style="margin-bottom:10px">${result.summary}</div>`;
    (result.suggestions||[]).slice(0,8).forEach((s,i)=>{
      rh+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--br);font-size:12px">
        <span style="font-weight:700">${s.nurse}</span>
        <span class="pill pill-bl">${s.date}</span>
        <span style="color:var(--rd)">${s.from||'off'}</span>→<span style="color:var(--gn)">${s.to}</span>
        <span style="flex:1;color:var(--mu);font-size:10px">${s.reason||''}</span>
        <button data-i="${i}" data-dept="${dept}" onclick="applySug(+this.dataset.i,this.dataset.dept)" class="btn btn-primary btn-sm">Apply</button>
      </div>`;
    });
    rh+=`<button data-dept="${dept}" onclick="applyAllSug(this.dataset.dept)" class="btn btn-primary" style="margin-top:10px;font-size:12px">Apply All</button></div>`;
    if(div)div.innerHTML=rh;
  }catch(e){toast(e.message,'err');}
};
window.applySug=async function(i,dept){
  const s=((window._sug||{})[dept]||[])[i];if(!s)return;
  const nurse=Object.values(ALL.p).find(p=>p.name===s.nurse&&p.dept===dept);
  if(!nurse){toast(T(['لم توجد','Not found']),'warn');return;}
  await fsSave('schedules',nurse.id+'_'+s.date,{nurse_id:nurse.id,date:s.date,shift:s.to,flag:null});
  if(!ALL.s[nurse.id])ALL.s[nurse.id]={};ALL.s[nurse.id][s.date]={shift:s.to,flag:null};

};
window.applyAllSug=async function(dept){
  for(const s of((window._sug||{})[dept]||[])){

window.genAISched=async function(){
  const myDept=ME.dept;
  const nurses=Object.values(ALL.p).filter(p=>p.role==='nurse'&&p.dept===myDept);
  const y=MONTH.getFullYear(),m=MONTH.getMonth(),days=new Date(y,m+1,0).getDate();
  const dc=ALL.d[myDept]||{m:3,e:3,n:3};
  const resDiv=document.getElementById('ai-result');
  if(!nurses.length){toast(T(['لا يوجد ممرضات في القسم','No nurses in dept']),'warn');return;}
  resDiv.innerHTML=`<div class="alert alert-info">🤖 ${T(['AI يولد الجدول...','AI generating schedule...'])}</div>`;
  const leaveInfo=nurses.map(n=>{
    const lp=(ALL.lp[n.id]||[]).filter(l=>{const d=new Date(l.date+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m;});
    return `${n.name}(${n.shift_type||'9h'})${lp.length?` off:${lp.map(l=>l.date.slice(8)).join(',')}`:'' }`;
  }).join(', ');
  const prompt=`Create a complete ${days}-day nurse schedule for ${mN(m)} ${y} in ${myDept}. Nurses: ${leaveInfo}. Daily targets: morning=${dc.m}, evening=${dc.e}, night=${dc.n}. Rules: min 6 rest days/month, respect requested off days, 12h nurses get long_day/long_night only, 9h nurses get morning/evening/night. Return ONLY valid JSON: {"schedule":{"NurseName":{"1":"morning",...}},"summary":"brief Arabic summary of coverage"}`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:6000,messages:[{role:'user',content:prompt}]})});
    const data=await r.json();
    const text=data.content?.[0]?.text||'';
    const match=text.match(/\{[\s\S]*\}/);if(!match)throw new Error('No valid JSON from AI');
    const result=JSON.parse(match[0]);
    let h=`<div class="alert alert-ok">✅ ${result.summary||T(['تم توليد الجدول','Schedule generated'])}</div>`;
    h+=`<button class="btn btn-primary" onclick="applyAISched(${JSON.stringify(result.schedule).replace(/"/g,'&quot;')})">💾 ${T(['تطبيق الجدول','Apply Schedule'])}</button>`;
    h+=`<div style="margin-top:12px;font-size:11px;color:var(--mu)">${T(['معاينة أول 7 أيام:','Preview first 7 days:'])}</div>`;
    h+=`<div class="tbl-wrap" style="margin-top:8px"><table style="min-width:500px"><thead><tr><th>${T(['الممرضة','Nurse'])}</th>`;
    for(let d=1;d<=7;d++)h+=`<th style="text-align:center">${d}</th>`;
    h+=`</tr></thead><tbody>`;
    nurses.forEach(n=>{
      const sh=result.schedule?.[n.name]||{};
      h+=`<tr><td>${n.name}</td>`;
      for(let d=1;d<=7;d++){
        const s=sh[String(d)]||'';
        h+=`<td style="text-align:center"><span class="cal-sh ${shClass[s]||''}" style="font-size:9px">${s?shLabel(s).slice(0,2):'—'}</span></td>`;
      }
      h+=`</tr>`;
    });
    h+=`</tbody></table></div>`;
    resDiv.innerHTML=h;
  }catch(e){resDiv.innerHTML=`<div class="alert alert-err">❌ ${e.message}</div>`;}
};
window.applyAISched=async function(schedule){
  const y=MONTH.getFullYear(),m=MONTH.getMonth(),days=new Date(y,m+1,0).getDate();
  const nurses=Object.values(ALL.p).filter(p=>p.role==='nurse'&&p.dept===ME.dept);
  let count=0;
  for(const nurse of nurses){
    const sh=schedule[nurse.name]||{};
    for(let d=1;d<=days;d++){
      const shift=sh[String(d)];if(!shift||shift==='off')continue;
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      await fsSave('schedules',nurse.id+'_'+ds,{nurse_id:nurse.id,date:ds,shift,flag:null});
      if(!ALL.s[nurse.id])ALL.s[nurse.id]={};ALL.s[nurse.id][ds]={shift,flag:null};count++;
    }
    await fsSave('schedule_status',nurse.id,{nurse_id:nurse.id,status:'submitted',submitted_at:new Date().toISOString(),auto_filled:true});
    ALL.st[nurse.id]={nurse_id:nurse.id,status:'submitted',auto_filled:true};
  }
  toast(T(['تم تطبيق الجدول ✓ (','Schedule applied ✓ (')+count+T([' يوم)',' days)']),'ok');
  document.getElementById('ai-result').innerHTML=`<div class="alert alert-ok">✅ ${T(['تم تطبيق الجدول بنجاح','Schedule applied successfully'])} — ${count} ${T(['يوم','days'])}</div>`;
};
