<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جولات رضا المرضى | مستشفى الجبيل العام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Mobile networks often drop one of the three SDK files. Re-fetch whatever is missing. */
window.__fbParts=[
  ['app','https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'],
  ['auth','https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'],
  ['firestore','https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js']
];
window.__fbMissing=function(){
  if(!window.firebase)return ['app','auth','firestore'];
  return ['auth','firestore'].filter(k=>typeof window.firebase[k]!=='function');
};
window.__fbReload=function(){
  const miss=window.__fbMissing();
  if(!miss.length)return Promise.resolve(true);
  return Promise.all(window.__fbParts.filter(p=>miss.includes(p[0])||miss.includes('app')).map(([k,url])=>
    new Promise(res=>{
      let done=false;
      const finish=v=>{if(!done){done=true;res(v);}};
      const sc=document.createElement('script');
      sc.src=url+'?r='+Date.now();
      sc.onload=()=>finish(true);
      sc.onerror=()=>finish(false);
      setTimeout(()=>finish(false),12000);   // never hang on a stalled mobile connection
      document.head.appendChild(sc);
    })
  )).then(()=>window.__fbMissing().length===0);
};
</script>
<style>
:root{
  --ink:#0d3b45;        /* deep petrol */
  --ink-2:#12525f;
  --teal:#0e8a8a;       /* primary */
  --teal-soft:#e2f2f1;
  --bg:#f2f6f7;
  --surface:#ffffff;
  --line:#e2eaec;
  --muted:#6b8189;
  --text:#173238;
  --coral:#e0523a;      /* problem / low */
  --coral-soft:#fdeae6;
  --amber:#e39a1f;      /* escalated */
  --amber-soft:#fcf1dc;
  --green:#1f9d6b;      /* resolved / high */
  --green-soft:#e2f4ec;
  --shadow:0 1px 2px rgba(13,59,69,.06),0 6px 20px rgba(13,59,69,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:800;color:var(--ink)}
.hidden{display:none !important}

/* ---------- Header ---------- */
header.top{
  background:linear-gradient(105deg,var(--ink),var(--ink-2));
  color:#fff;padding:0 20px;position:sticky;top:0;z-index:50;
  box-shadow:0 4px 18px rgba(13,59,69,.18);
}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px}
.brand .mark{
  width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);
  display:grid;place-items:center;font-size:20px;border:1px solid rgba(255,255,255,.2)
}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:-2px}
.top-spacer{flex:1}
.userchip{
  display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);
  padding:6px 12px;border-radius:40px;font-size:13.5px;border:1px solid rgba(255,255,255,.16)
}
.userchip .av{width:26px;height:26px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-weight:700;font-size:12px}
.userchip .role{opacity:.72;font-size:11.5px}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500}
.dbstatus{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:30px;border:1px solid rgba(255,255,255,.18)}
.dbstatus::before{content:"";width:8px;height:8px;border-radius:50%;background:#9fb3b8}
.dbstatus.cloud{background:rgba(31,157,107,.22)}
.dbstatus.cloud::before{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.dbstatus.local{background:rgba(255,255,255,.1)}
.btn-ghost:hover{background:rgba(255,255,255,.2)}

/* ---------- Nav ---------- */
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:40}
.tabs-inner{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding:0 16px;overflow-x:auto}
.tab{
  border:none;background:none;padding:15px 16px 12px;font-size:14.5px;font-weight:700;color:var(--muted);
  border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px
}
.tab .badge{background:var(--coral);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.tab.active{color:var(--ink);border-bottom-color:var(--teal)}
.tab:hover{color:var(--ink)}

/* ---------- Layout ---------- */
main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:23px}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-pad{padding:22px}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:11px;padding:12px 20px;font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#0b7676}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-outline:hover{border-color:var(--teal);color:var(--teal)}
.btn-coral{background:var(--coral);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Forms ---------- */
label.fld{display:block;font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:7px}
.req::after{content:" *";color:var(--coral)}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14.5px;
  background:#fbfdfd;color:var(--text);transition:.15s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px var(--teal-soft)}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-opt{flex:1;min-width:110px;border:1.5px solid var(--line);background:#fbfdfd;border-radius:10px;padding:11px;text-align:center;font-weight:700;font-size:14px;color:var(--text)}
.seg-opt.on{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.lockchip{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px dashed var(--line);background:#f3f7f8;border-radius:10px;padding:11px 13px;font-weight:800;color:var(--ink)}
.lockchip span{opacity:.5;font-size:13px}
.deptchecks{display:flex;flex-wrap:wrap;gap:8px;max-height:190px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fbfdfd}
.dchk{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;user-select:none}
.dchk:hover{border-color:var(--teal)}
.dchk input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}
.dchk.all{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}
.dchk input:disabled+*{opacity:.5}

/* ---------- Rating scale ---------- */
.qblock{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;background:#fbfdfd}
.qblock.flagged{border-color:var(--coral);background:var(--coral-soft)}
.qtitle{font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.qtitle .n{background:var(--ink);color:#fff;border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center;font-size:12.5px;flex:none}
.scale{display:flex;gap:7px}
.dot{
  flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;text-align:center;
  font-size:12.5px;font-weight:700;color:var(--muted);transition:.12s;line-height:1.25
}
.dot .num{display:block;font-size:16px;margin-bottom:1px}
.dot:hover{border-color:var(--teal)}
.dot.sel-5{border-color:var(--green);background:var(--green-soft);color:#146b48}
.dot.sel-4{border-color:var(--green);background:var(--green-soft);color:#146b48}
.dot.sel-3{border-color:var(--amber);background:var(--amber-soft);color:#8a5f0e}
.dot.sel-2{border-color:var(--coral);background:var(--coral-soft);color:#a83320}
.dot.sel-1{border-color:var(--coral);background:var(--coral-soft);color:#a83320}
.flag-note{margin-top:11px;font-size:13px;color:#a83320;font-weight:700;display:flex;align-items:center;gap:6px}

/* ---------- Problem cards ---------- */
.prob{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:#fff}
.prob-head{padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prob-src{font-weight:800;color:var(--ink);font-size:14.5px}
.prob-body{padding:0 16px 16px}
.status{border-radius:30px;padding:4px 12px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:5px}
.st-open{background:var(--coral-soft);color:#a83320}
.st-esc{background:var(--amber-soft);color:#8a5f0e}
.st-res{background:var(--green-soft);color:#146b48}
.pill{background:var(--teal-soft);color:var(--ink);border-radius:30px;padding:3px 11px;font-size:12px;font-weight:700}
.choice{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.choice .btn{flex:1;min-width:150px;justify-content:center}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:17px 18px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
.kpi .val{font-size:30px;font-weight:800;color:var(--ink);line-height:1}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:6px}
.kpi.accent .val{color:var(--teal)}
.kpi.good .val{color:var(--green)}
.kpi.warn .val{color:var(--coral)}

/* ---------- Chart ---------- */
.chartwrap{padding:6px 4px 0}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:46px;border-radius:9px 9px 4px 4px;background:linear-gradient(var(--teal),#0b7676);position:relative;transition:.4s;min-height:3px}
.bar span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:var(--ink)}
.bar-lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-align:center}

/* horizontal question bars */
.qbar{margin-bottom:13px}
.qbar-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
.qbar-top .sc{color:var(--muted)}
.track{height:12px;background:#eef3f4;border-radius:20px;overflow:hidden}
.fill{height:100%;border-radius:20px;transition:.5s}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:11px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:12.5px;background:#f8fbfb}
tbody tr:hover{background:#f8fbfb}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:44px;margin-bottom:10px}
.empty h3{color:var(--ink);margin-bottom:6px}

/* ---------- Modal / login ---------- */
.overlay{position:fixed;inset:0;background:rgba(13,59,69,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal h2{font-size:22px;margin-bottom:6px}
.modal p.lead{color:var(--muted);margin:0 0 22px;font-size:14px}
.rolepick{display:grid;gap:10px;margin-bottom:18px}
.role-opt{border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;display:flex;align-items:center;gap:13px;text-align:right}
[dir="ltr"] th,[dir="ltr"] td{text-align:left}
[dir="ltr"] .role-opt{text-align:left}
[dir="ltr"] input,[dir="ltr"] textarea,[dir="ltr"] select{text-align:left}
[dir="ltr"] .bar-lbl{direction:ltr}
.role-opt .ic{width:42px;height:42px;border-radius:11px;background:var(--teal-soft);display:grid;place-items:center;font-size:21px;flex:none}
.role-opt .t{font-weight:800;color:var(--ink);font-size:15px}
.role-opt .d{font-size:12.5px;color:var(--muted)}
.role-opt.on{border-color:var(--teal);background:var(--teal-soft)}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--coral)}

.section-title{font-size:16px;font-weight:800;color:var(--ink);margin:26px 0 14px;display:flex;align-items:center;gap:9px}
.section-title::before{content:"";width:4px;height:18px;background:var(--teal);border-radius:4px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.divider{height:1px;background:var(--line);margin:22px 0}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);background:#eef3f4;border-radius:20px;padding:3px 10px}

@media(max-width:720px){
  .grid2,.grid3{grid-template-columns:1fr}
  .page-head h2{font-size:20px}
  .kpi .val{font-size:25px}
  .scale{flex-wrap:wrap}
  .dot{min-width:56px}
}

/* ---------- Phones ---------- */
@media(max-width:640px){
  header.top{padding:0 12px}
  .top-inner{gap:8px;min-height:auto;padding:10px 0}
  .brand{font-size:16px;gap:9px;width:100%}
  .brand .mark{width:32px;height:32px;font-size:17px}
  .brand small{font-size:10.5px}
  .top-spacer{display:none}
  .userchip{font-size:12px;padding:5px 10px;order:3}
  .userchip .role{display:none}
  .dbstatus{font-size:11px;padding:4px 9px}
  nav.tabs{position:sticky;top:0}
  .tabs-inner{padding:0 8px;gap:0}
  .tab{padding:13px 12px 10px;font-size:13.5px}
  main{padding:16px 12px 50px}
  .card-pad{padding:16px}
  .page-head{margin-bottom:16px}
  .page-head h2{font-size:19px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kpi{padding:13px 14px;border-radius:13px}
  .kpi .val{font-size:22px}
  .kpi .lbl{font-size:11.5px;margin-bottom:6px}
  .kpi .sub{font-size:11px}
  .btn{padding:13px 18px}
  .btn-sm{padding:10px 14px}
  .seg-opt{min-width:calc(50% - 4px);padding:13px 8px}
  .dot{min-width:calc(33.33% - 5px);padding:11px 4px}
  .qblock{padding:14px}
  .qtitle{font-size:14px}
  .bars{height:150px;gap:6px}
  .bar-lbl{font-size:10px}
  .choice .btn{min-width:100%}
  .deptchecks{max-height:230px}
  .dchk{width:100%}

  /* tables become stacked cards — labels come from data-label */
  table,thead,tbody,tr,th,td{display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table{font-size:13.5px}
  tbody tr{
    border:1px solid var(--line);border-radius:13px;margin-bottom:11px;
    padding:6px 2px;background:#fff;box-shadow:0 1px 3px rgba(13,59,69,.05)
  }
  tbody tr:hover{background:#fff}
  tbody td{
    border:none;border-bottom:1px dashed var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:9px 13px;text-align:start
  }
  tbody td:last-child{border-bottom:none}
  tbody td::before{
    content:attr(data-label);font-size:12px;font-weight:700;color:var(--muted);
    flex:none;max-width:45%
  }
  tbody td:empty{display:none}
  tbody td.no-label::before{content:none}
  tbody td.no-label{justify-content:flex-end}

  .overlay{padding:14px;align-items:start;padding-top:32px;overflow-y:auto}
  .modal{padding:22px;border-radius:16px}
  .modal h2{font-size:19px}
}
/* iOS zooms the page when a field's text is under 16px — keep inputs at 16px */
@media(max-width:640px){
  input[type=text],input[type=number],input[type=password],select,textarea{font-size:16px}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="overlay" id="login">
  <div class="modal">
    <h2 id="lg_title">نظام جولات رضا المرضى</h2>
    <p class="lead" id="lg_sub">مستشفى الجبيل العام · جميع الأقسام</p>
    <label class="fld req" id="lg_email_l">البريد الإلكتروني</label>
    <input type="text" id="loginEmail" placeholder="name@example.com" autocomplete="username" style="margin-bottom:16px">
    <label class="fld req" id="lg_pass_l">كلمة المرور</label>
    <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" style="margin-bottom:20px" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center" onclick="doLogin()">تسجيل الدخول</button>
    <p class="hint" id="lg_note" style="text-align:center;margin-top:16px">الدخول للموظفات المصرّح لهنّ فقط. للحصول على حساب راجعي الإدارة.</p>
    <p class="hint" id="loginMsg" style="text-align:center;color:var(--coral);font-weight:700;min-height:18px"></p>
    <div id="lg_retry" style="margin-top:6px"></div>
  </div>
</div>

<!-- ============ HEADER ============ -->
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark">🏥</div>
      <div><span id="brandTitle">جولات رضا المرضى</span><small id="brandSub">مستشفى الجبيل العام · رضا المرضى وجودة التمريض</small></div>
    </div>
    <div class="top-spacer"></div>
    <button class="btn-ghost" id="langBtn" onclick="toggleLang()" title="Language / اللغة" style="font-weight:800">EN</button>
    <span id="dbstatus" class="dbstatus" title="status"></span>
    <div class="userchip" id="userchip"></div>
    <button class="btn-ghost" id="logoutBtn" onclick="logout()">تسجيل الخروج</button>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" id="tabs"></div>
</nav>

<main id="app"></main>

<div id="toast"></div>

<script>
/* ================= STATE ================= */
const LS_ROUNDS='jhn_rounds_v1', LS_USER='jhn_user_v1';
let USER=null, ROUNDS=[];

/* rated questions (1-5) */
const QRATED=[{k:'q3',n:3},{k:'q4',n:4},{k:'q5',n:5},{k:'q6',n:6},{k:'q7',n:7},{k:'q8',n:8}];
const SCALE=[{v:5},{v:4},{v:3},{v:2},{v:1}];
const THRESHOLD=2; // <= 2 يُعتبر مشكلة تلقائية

/* ================= UTIL ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const DEPT_AR=DEPTS.map(d=>d.ar);
function deptLabel(ar){const d=DEPTS.find(x=>x.ar===ar);return d?(LANG==='en'?d.en:d.ar):(ar||'');}
function isMultiDept(u){return !!u&&(u.role==='sup'||u.role==='admin');}
function seesAll(u){return isMultiDept(u);}
function userDepts(u){
  if(!u)return[];
  if(u.role==='tech'||u.role==='head')return u.dept?[u.dept]:[];
  // sup/admin: no depts field at all = legacy account → treat as all departments
  const d=(u.depts==null)?['*']:u.depts;
  return d.includes('*')?DEPT_AR.slice():d;
}
function seesAllDepts(u){return !!u&&isMultiDept(u)&&(u.depts==null||u.depts.includes('*'));}
function canManageProblems(u){return !!u&&['head','sup','admin'].includes(u.role);}
function canManageUsers(u){return !!u&&u.role==='admin';}
function canExport(u){return !!u&&['head','sup','admin'].includes(u.role);}
function canSeeStaff(u){return !!u&&['head','sup','admin'].includes(u.role);}
function canDoRounds(u){return !!u&&u.role==='tech';}
function inScope(u,r){return !!r&&userDepts(u).includes(r.dept);}
function scopedRounds(){return ROUNDS.filter(r=>inScope(USER,r));}

let db=null, auth=null, cloud=false, roundsSubbed=false;

/* ---- data layer (cloud only) ---- */
function saveLocal(){try{localStorage.setItem(LS_ROUNDS,JSON.stringify(ROUNDS));}catch(e){}}
const DB={
  save(round){
    const i=ROUNDS.findIndex(r=>r.id===round.id);
    if(i>=0)ROUNDS[i]=round; else ROUNDS.unshift(round);           // optimistic
    ROUNDS.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    if(cloud){db.collection(RC).doc(round.id).set(round).catch(e=>{console.error(e);toast(t('toast_cloud_savefail'),'err');});}
    else{saveLocal();}
  },
  remove(id){
    ROUNDS=ROUNDS.filter(r=>r.id!==id);
    if(cloud){db.collection(RC).doc(id).delete().catch(e=>console.error(e));}
    else{saveLocal();}
  }
};

function setStatus(ok){const el=$('#dbstatus');if(!el)return;el.className='dbstatus '+(ok?'cloud':'local');el.textContent=ok?t('status_cloud'):t('status_local');}
function loginMsg(m,neutral){const el=$('#loginMsg');if(!el)return;el.textContent=m||'';el.style.color=neutral?'var(--muted)':'var(--coral)';}
function showLogin(){const l=$('#login');if(l)l.classList.remove('hidden');}
function hideLogin(){const l=$('#login');if(l)l.classList.add('hidden');}

async function initDB(attempt){
  attempt=attempt||1;
  if(!USE_FIREBASE){setStatus(false);loginMsg(t('err_fb_load'));return;}
  // one of the SDK files may not have arrived (common on mobile data) → fetch it again
  if(window.__fbMissing&&window.__fbMissing().length){
    loginMsg(t('connecting'),true);
    const ok=await window.__fbReload();
    if(!ok){setStatus(false);showRetry(t('err_fb_load'));return;}
  }
  if(!window.firebase||typeof firebase.firestore!=='function'||typeof firebase.auth!=='function'){
    setStatus(false);showRetry(t('err_fb_load'));return;
  }
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    db=firebase.firestore(); auth=firebase.auth();
    // some mobile browsers (private mode) block IndexedDB → fall back so login still works
    try{ await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
    catch(e1){ try{ await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); }catch(e2){} }
    setStatus(true);
    loginMsg('');
    auth.onAuthStateChanged(handleAuth);
  }catch(e){
    console.error('Firebase init failed:',e);
    setStatus(false);
    if(attempt<2){setTimeout(()=>initDB(attempt+1),1200);return;}
    showRetry(t('err_server'));
  }
}
function showRetry(msg){
  loginMsg(msg);
  const box=$('#lg_retry');if(!box)return;
  box.innerHTML=`<button class="btn btn-outline btn-sm" onclick="retryConnect()">${t('btn_retry')}</button>`;
}
async function retryConnect(){
  const box=$('#lg_retry');if(box)box.innerHTML='';
  loginMsg(t('connecting'),true);
  await initDB(1);
}

/* runs on login/logout */
async function handleAuth(fbUser){
  if(!fbUser){USER=null;current='';ROUNDS=[];unsubscribeRounds();showLogin();return;}
  try{
    const snap=await db.collection(UC).doc(fbUser.uid).get();
    let prof=snap.exists?snap.data():null;
    if(!prof){
      let firstEver=false;
      try{ const any=await db.collection(UC).limit(1).get(); firstEver=any.empty; }
      catch(err){ loginMsg(t('err_unauth')); await auth.signOut(); return; }
      if(firstEver){ // first user ever → admin
        prof={name:(fbUser.email||'admin').split('@')[0],email:(fbUser.email||'').toLowerCase(),role:'admin',depts:['*'],createdAt:new Date().toISOString()};
        await db.collection(UC).doc(fbUser.uid).set(prof);
        toast(t('toast_admin_created'),'ok');
      }else{
        loginMsg(t('err_unauth'));
        await auth.signOut(); return;
      }
    }
    if(prof.active===false){ loginMsg(t('err_unauth')); await auth.signOut(); return; }
    USER={uid:fbUser.uid,email:fbUser.email,...prof};
    loginMsg(''); hideLogin(); subscribeRounds(); boot();
  }catch(e){console.error(e);loginMsg(t('err_load_acct'));}
}

let roundsUnsubs=[];
const ROUNDS_BY_DEPT={};
function unsubscribeRounds(){
  roundsUnsubs.forEach(u=>{try{u();}catch(e){}});
  roundsUnsubs=[];roundsSubbed=false;
  for(const k in ROUNDS_BY_DEPT)delete ROUNDS_BY_DEPT[k];
}
function subscribeRounds(){
  if(roundsSubbed)return; roundsSubbed=true; cloud=true;
  const errH=e=>{console.error(e);toast(t('toast_cloud_lost'),'err');};
  if(seesAllDepts(USER)){
    // full access → one listener, no filter
    roundsUnsubs.push(db.collection(RC).onSnapshot(snap=>onData(snap.docs.map(d=>d.data())),errH));
  }else{
    // scoped roles → one listener per allowed department (matches security rules)
    const ds=userDepts(USER);
    ds.forEach(d=>{
      roundsUnsubs.push(db.collection(RC).where('dept','==',d).onSnapshot(snap=>{
        ROUNDS_BY_DEPT[d]=snap.docs.map(x=>x.data());
        const all=[];ds.forEach(k=>{(ROUNDS_BY_DEPT[k]||[]).forEach(r=>all.push(r));});
        onData(all);
      },errH));
    });
  }
}

function onData(rounds){
  ROUNDS=rounds.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  if(!USER)return;
  buildTabs();
  const ae=document.activeElement;
  const typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName||'');
  if(current!=='new'&&current!=='users'&&!typing)render();
}
function toast(msg,type=''){const t=$('#toast');t.textContent=msg;t.className='show '+type;setTimeout(()=>t.className='',2600);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function initials(n){return (n||'?').trim().slice(0,2);}

/* ---- problem helpers ---- */
function allProblems(){
  const out=[];
  ROUNDS.forEach(r=>r.problems.forEach(p=>out.push({...p,round:r})));
  return out;
}
function scopedProblems(){
  const out=[];
  scopedRounds().forEach(r=>r.problems.forEach(p=>out.push({...p,round:r})));
  return out;
}
function escalatedInScope(){return scopedProblems().filter(p=>p.status==='escalated');}

/* ---- scoring ---- */
function roundAvg(r){
  const vals=QRATED.map(q=>r.ratings[q.k]).filter(v=>v);
  if(!vals.length)return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function pct(avg){return avg==null?null:Math.round(avg/5*100);}

async function doLogin(){
  const email=$('#loginEmail').value.trim();
  const pass=$('#loginPass').value;
  if(!email||!pass){loginMsg(t('err_fill_login'));return;}
  if(!auth){loginMsg(t('err_noserver'));return;}
  const btn=$('#loginBtn');btn.disabled=true;btn.textContent=t('login_signingin');loginMsg('');
  try{await auth.signInWithEmailAndPassword(email,pass);}
  catch(e){loginMsg(authErr(e));}
  finally{btn.disabled=false;btn.textContent=t('login_btn');}
}
function authErr(e){
  const m={'auth/invalid-email':'e_invalid_email','auth/user-not-found':'e_user_not_found',
    'auth/wrong-password':'e_wrong_pass','auth/invalid-credential':'e_invalid_cred',
    'auth/too-many-requests':'e_too_many','auth/user-disabled':'e_disabled',
    'auth/email-already-in-use':'e_in_use','auth/weak-password':'e_weak',
    'auth/network-request-failed':'e_network','auth/internal-error':'e_network'};
  return t(m[e&&e.code]||'err_login_generic');
}
function logout(){current='';USER=null;if(auth){auth.signOut();}showLogin();}

let TABS=[],current='';
function buildTabs(){
  if(!USER){TABS=[];return;}
  const r=USER.role;
  if(r==='tech'){
    TABS=[{id:'new',lbl:t('tab_new'),ic:'➕'},{id:'myrounds',lbl:t('tab_myrounds'),ic:'📋'}];
  }else if(r==='head'){
    TABS=[{id:'problems',lbl:t('tab_problems'),ic:'⚠️',badge:()=>escalatedInScope().length},
          {id:'all',lbl:t('tab_all_dept'),ic:'📋'},{id:'staff',lbl:t('tab_staff'),ic:'👩‍⚕️'},{id:'dash',lbl:t('tab_dash'),ic:'📊'}];
  }else if(r==='sup'){
    TABS=[{id:'problems',lbl:t('tab_problems'),ic:'⚠️',badge:()=>escalatedInScope().length},
          {id:'all',lbl:t('tab_all_all'),ic:'📋'},{id:'staff',lbl:t('tab_staff'),ic:'👩‍⚕️'},{id:'dash',lbl:t('tab_dash'),ic:'📊'}];
  }else{ // admin
    TABS=[{id:'dash',lbl:t('tab_dash'),ic:'📊'},
          {id:'problems',lbl:t('tab_problems'),ic:'⚠️',badge:()=>escalatedInScope().length},
          {id:'all',lbl:t('tab_all_all'),ic:'📋'},{id:'staff',lbl:t('tab_staff'),ic:'👩‍⚕️'},
          {id:'users',lbl:t('tab_users'),ic:'👥'}];
  }
  const wrap=$('#tabs');if(!wrap)return;wrap.innerHTML='';
  TABS.forEach(tb=>{
    const b=document.createElement('button');
    b.className='tab'+(tb.id===current?' active':'');
    const bc=tb.badge?tb.badge():0;
    b.innerHTML=`<span>${tb.ic}</span> ${tb.lbl}`+(bc>0?` <span class="badge">${bc}</span>`:'');
    b.onclick=()=>{current=tb.id;render();};
    wrap.appendChild(b);
  });
}
function boot(){
  const deptTxt=seesAllDepts(USER)?t('all_departments'):(isMultiDept(USER)?t('n_departments',{n:num(userDepts(USER).length)}):deptLabel(USER.dept||''));
  $('#userchip').innerHTML=`<span class="av">${esc(initials(USER.name))}</span>
     <span>${esc(USER.name)}<span class="role"> · ${roleLabel(USER.role)}${deptTxt?' · '+esc(deptTxt):''}</span></span>`;
  if(!current)current = USER.role==='tech'?'new' : (USER.role==='admin'?'dash':'problems');

function render(){
  buildTabs();
  const v={new:viewNew,myrounds:viewMyRounds,all:viewAll,problems:viewProblems,dash:viewDash,staff:viewStaff,users:viewUsers}[current];
  $('#app').innerHTML='';
  if(v)v(); else if(TABS[0]){current=TABS[0].id;render();}
  labelCells();
}
/* On phones each table row becomes a card; every cell needs its column name. */
function labelCells(root){
  (root||document).querySelectorAll('table').forEach(tb=>{
    const heads=[...tb.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    if(!heads.length)return;
    tb.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{
        const h=heads[i]||'';
        if(h)td.setAttribute('data-label',h); else td.classList.add('no-label');
      });
    });
  });
}

function paintSeg(id,el){document.querySelectorAll('#'+id+' .seg-opt').forEach(o=>o.classList.remove('on'));el.classList.add('on');}
function arNum(n){return num(n);}
function probLabel(p){return p&&p.qkey?t('q_'+p.qkey):((p&&p.label)||t('issue_word'));}
function ptypeLabel(v){return v==='مريض'?t('opt_patient'):v==='مرافق'?t('opt_companion'):(v||'');}
function renderLogin(){

function renderQuestions(){
  const box=$('#qlist');box.innerHTML='';
  QRATED.forEach(q=>{
    const cur=draft.ratings[q.k];
    const flagged=cur&&cur<=THRESHOLD;
    const d=document.createElement('div');
    d.className='qblock'+(flagged?' flagged':'');
    d.innerHTML=`<div class="qtitle"><span class="n">${arNum(q.n)}</span> ${qLabel(q)}</div>
      <div class="scale" data-k="${q.k}"></div>
      ${flagged?'<div class="flag-note">'+t('flag_note')+'</div>':''}`;
    box.appendChild(d);
    renderScale(d.querySelector('.scale'),q.k);
  });
}
function renderScale(target,key){
  const el=typeof target==='string'?$('#'+target):target;
  el.innerHTML='';
  const cur=draft.ratings[key];
  SCALE.forEach(s=>{
    const b=document.createElement('div');
    b.className='dot'+(cur===s.v?' sel-'+s.v:'');
    b.innerHTML=`<span class="num">${arNum(s.v)}</span>${t('sc_'+s.v)}`;
    b.onclick=()=>{draft.ratings[key]=s.v;if(key==='overall'){renderScale('overallScale','overall');}else{renderQuestions();}updateLive();};
    el.appendChild(b);
  });
}
function updateLive(){
  const avg=roundAvg(draft);
  const flagged=QRATED.filter(q=>draft.ratings[q.k]&&draft.ratings[q.k]<=THRESHOLD).length;
  const el=$('#liveScore');if(!el)return;
  if(avg==null){el.textContent=t('live_notstarted');return;}
  el.innerHTML=t('live_avg')+`: <b style="color:var(--ink)">${avg.toFixed(1)}/5 (${pct(avg)}%)</b>`+
    (flagged?` · <span style="color:var(--coral);font-weight:700">`+t('live_flagged',{n:arNum(flagged)})+`</span>`:' · '+t('live_noflag'));
}

/* ---- problems review step ---- */
function goProblems(){
  if(!draft.dept||!draft.room.trim()||!draft.ptype){toast(t('err_complete'),'err');return;}
  const answered=QRATED.filter(q=>draft.ratings[q.k]).length;
  if(answered<QRATED.length){toast(t('err_rateall'),'err');return;}
  // (re)build auto problems from low ratings, keep existing decisions
  const prev={};draft.problems.forEach(p=>{if(p.qkey)prev[p.qkey]=p;});
  draft.problems=[];
  QRATED.forEach(q=>{
    if(draft.ratings[q.k]<=THRESHOLD){
      const old=prev[q.k];
      draft.problems.push(old||{id:uid(),qkey:q.k,label:I18N.ar['q_'+q.k],score:draft.ratings[q.k],note:'',status:'open',actionTech:'',actionSup:'',escalatedTo:'',handledBy:''});
      // refresh score in case changed
      draft.problems[draft.problems.length-1].score=draft.ratings[q.k];
    }
  });
  renderProblemStep();
}
function renderProblemStep(){
  const app=$('#app');
  const probs=draft.problems;
  app.innerHTML=`
  <div class="page-head">
    <div><h2>${t('ps_title')}</h2><p>${esc(deptLabel(draft.dept))} · ${t('room_word')} ${esc(draft.room)} · ${esc(ptypeLabel(draft.ptype))}</p></div>
    <button class="btn btn-outline btn-sm" onclick="viewNew()">${t('back_eval')}</button>
  </div>`;

  if(!probs.length){
    app.innerHTML+=`<div class="card card-pad"><div class="empty">
      <div class="ic">✅</div><h3>${t('no_issues_title')}</h3>
      <p>${t('no_issues_sub')}</p>
      <button class="btn btn-primary" style="margin-top:14px" onclick="commitRound()">${t('save_round')}</button>
    </div></div>`;
    return;
  }

  let html='<div class="card card-pad">';
  html+=`<div class="hint" style="margin-bottom:16px">`+t('ps_intro',{n:'<b style="color:var(--coral)">'+arNum(probs.length)+'</b>'})+`</div>`;
  probs.forEach((p,i)=>{
    html+=`<div class="prob" id="prob_${p.id}">
      <div class="prob-head">
        <span class="pill">${arNum(i+1)}</span>
        <span class="prob-src">${esc(probLabel(p))}</span>
        <span class="tag">${t('rating_word')}: ${arNum(p.score)}/5</span>
        <div style="flex:1"></div>
        <span class="status ${statusClass(p.status)}">${statusLabel(p.status)}</span>
      </div>
      <div class="prob-body">
        <label class="fld">${t('f_probdesc')}</label>
        <textarea data-f="note" data-id="${p.id}" placeholder="${t('f_probdesc_ph')}">${esc(p.note)}</textarea>
        <div class="choice">
          <button class="btn ${p.status==='resolved'?'btn-green':'btn-outline'} btn-sm" onclick="chooseResolve('${p.id}')">${t('btn_resolved_now')}</button>
          <button class="btn ${p.status==='escalated'?'btn-coral':'btn-outline'} btn-sm" onclick="chooseEscalate('${p.id}')">${t('btn_escalate')}</button>
        </div>
        <div id="detail_${p.id}" style="margin-top:12px"></div>
      </div>
    </div>`;
  });
  html+=`<div class="divider"></div>
    <div class="row-between">
      <div class="hint" id="probSummary"></div>
      <button class="btn btn-primary" onclick="commitRound()">${t('save_round')}</button>
    </div></div>`;
  app.innerHTML+=html;

  probs.forEach(p=>renderProbDetail(p));
  document.querySelectorAll('[data-f=note]').forEach(t=>t.oninput=e=>{
    const p=draft.problems.find(x=>x.id===e.target.dataset.id);p.note=e.target.value;
  });
  updateProbSummary();
}
function statusClass(s){return s==='resolved'?'st-res':s==='escalated'?'st-esc':'st-open';}
function statusLabel(s){return s==='resolved'?t('st_resolved'):s==='escalated'?t('st_escalated'):t('st_open');}
function renderProbDetail(p){
  const box=$('#detail_'+p.id);if(!box)return;
  if(p.status==='resolved'){
    box.innerHTML=`<div style="background:var(--green-soft);border-radius:11px;padding:13px 15px">
      <label class="fld" style="color:#146b48">${t('ap_resolved_label')}</label>
      <textarea data-f="actionTech" data-id="${p.id}" placeholder="${t('ap_resolved_ph')}">${esc(p.actionTech)}</textarea>
    </div>`;
  }else if(p.status==='escalated'){
    box.innerHTML=`<div style="background:var(--amber-soft);border-radius:11px;padding:13px 15px">
      <label class="fld" style="color:#8a5f0e">${t('esc_reason_label')}</label>
      <textarea data-f="escalatedTo" data-id="${p.id}" placeholder="${t('esc_reason_ph')}">${esc(p.escalatedTo)}</textarea>
    </div>`;
  }else{box.innerHTML='';}
  box.querySelectorAll('textarea').forEach(t=>t.oninput=e=>{
    const pr=draft.problems.find(x=>x.id===e.target.dataset.id);pr[e.target.dataset.f]=e.target.value;
  });
}
function chooseResolve(id){const p=draft.problems.find(x=>x.id===id);p.status='resolved';p.escalatedTo='';refreshProb(p);}
function chooseEscalate(id){const p=draft.problems.find(x=>x.id===id);p.status='escalated';p.actionTech='';refreshProb(p);}
function refreshProb(p){
  const card=$('#prob_'+p.id);
  card.querySelector('.status').className='status '+statusClass(p.status);

  const btns=card.querySelectorAll('.choice .btn');
  btns[0].className='btn '+(p.status==='resolved'?'btn-green':'btn-outline')+' btn-sm';
  btns[1].className='btn '+(p.status==='escalated'?'btn-coral':'btn-outline')+' btn-sm';
  renderProbDetail(p);updateProbSummary();
}
function updateProbSummary(){
  const el=$('#probSummary');if(!el)return;
  const undecided=draft.problems.filter(p=>p.status==='open').length;
  const res=draft.problems.filter(p=>p.status==='resolved').length;
  const esc2=draft.problems.filter(p=>p.status==='escalated').length;
  el.innerHTML=t('sum_resolved')+`: <b style="color:var(--green)">${arNum(res)}</b> · `+t('sum_escalated')+`: <b style="color:var(--amber)">${arNum(esc2)}</b>`+
    (undecided?` · <span style="color:var(--coral)">`+t('sum_remaining',{n:arNum(undecided)})+`</span>`:'');
}
function commitRound(){
  const undecided=draft.problems.filter(p=>p.status==='open').length;
  if(undecided){toast(t('err_decide'),'err');return;}
  // finalize resolved problems metadata
  draft.problems.forEach(p=>{
    if(p.status==='resolved'){p.handledBy=USER.name;p.resolvedTs=new Date().toISOString();}
    if(p.status==='escalated'){p.escalatedBy=USER.name;}
  });
  const round={
    id:uid(),ts:new Date().toISOString(),
    dept:draft.dept,room:draft.room.trim(),pname:(draft.pname||'').trim(),mrn:(draft.mrn||'').trim(),ptype:draft.ptype,tech:USER.name,techUid:USER.uid||'',
    ratings:{...draft.ratings},liked:draft.liked.trim(),suggestions:draft.suggestions.trim(),nurse:draft.nurse.trim(),
    problems:draft.problems
  };
  DB.save(round);
  const esc2=draft.problems.filter(p=>p.status==='escalated').length;
  draft=null;
  toast(t('toast_saved')+(esc2?t('toast_saved_esc',{n:arNum(esc2)}):''),'ok');
  current='myrounds';render();
}

function probStatusBar(lbl,n,total,col){
  const p=total?n/total*100:0;
  return `<div class="qbar"><div class="qbar-top"><span>${lbl}</span><span class="sc">${num(n)}${total?' / '+num(total):''}</span></div>
    <div class="track"><div class="fill" style="width:${p}%;background:${col}"></div></div></div>`;
}
function questionAverages(rounds){
  if(!rounds.length)return '<div class="hint">'+t('no_rounds_period')+'</div>';
  return QRATED.map(q=>{
    const vals=rounds.map(r=>r.ratings[q.k]).filter(v=>v);
    const a=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:0;
    const col=a>=4?'var(--green)':a>=3?'var(--amber)':'var(--coral)';
    const lb=qLabel(q);
    return `<div class="qbar"><div class="qbar-top"><span>${esc(lb.length>42?lb.slice(0,42)+'…':lb)}</span><span class="sc">${a.toFixed(1)}</span></div>
      <div class="track"><div class="fill" style="width:${a/5*100}%;background:${col}"></div></div></div>`;
  }).join('');
}
function deptBreakdown(){
  const rows=userDepts(USER).map(d=>({d,rs:scopedRounds().filter(r=>r.dept===d)})).filter(x=>x.rs.length).sort((a,b)=>b.rs.length-a.rs.length);
  if(!rows.length)return '<div class="hint">'+t('no_rounds_yet')+'</div>';
  return rows.map(({d,rs})=>{
    const a=periodAvg(rs);
    return `<div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--line)">
      <span style="font-weight:700">${esc(deptLabel(d))}</span>
      <span><span class="tag">${num(rs.length)} ${LANG==='en'&&rs.length===1?'round':t('rounds_unit')}</span> <b style="color:${avgColor(a)}">${a?a.toFixed(1)+'/5':'—'}</b></span></div>`;
  }).join('');
}
function periodAvg(rounds){
  const avgs=rounds.map(roundAvg).filter(v=>v!=null);
  if(!avgs.length)return null;
  return avgs.reduce((a,b)=>a+b,0)/avgs.length;
}
function trendBars(buckets){
  const max=5;
  return buckets.map(b=>{
    const a=periodAvg(b.rounds);
    const h=a?(a/max*100):0;
    const col=a==null?'#dde6e7':a>=4?'linear-gradient(var(--green),#178a5b)':a>=3?'linear-gradient(var(--amber),#c98410)':'linear-gradient(var(--coral),#c23f28)';
    return `<div class="bar-col"><div class="bar" style="height:${h}%;background:${col}">${a?`<span>${a.toFixed(1)}</span>`:''}</div><div class="bar-lbl">${b.label}</div></div>`;
  }).join('');
}

/* ---- bucket generation ---- */
function dloc(){return LANG==='en'?'en-GB':'ar-SA-u-nu-latn';}
function makeBuckets(period,data){
  const now=new Date();const buckets=[];
  const cfg={daily:{n:14},weekly:{n:8},monthly:{n:6},quarterly:{n:4},yearly:{n:3}}[period];
  for(let i=cfg.n-1;i>=0;i--){
    let start,end,label;
    if(period==='daily'){
      const d=new Date(now);d.setDate(now.getDate()-i);d.setHours(0,0,0,0);
      start=new Date(d);end=new Date(d);end.setHours(23,59,59,999);
      label=d.toLocaleDateString(dloc(),{day:'numeric',month:'numeric'});
    }else if(period==='weekly'){
      const d=new Date(now);d.setDate(now.getDate()-i*7);const dow=d.getDay();
      start=new Date(d);start.setDate(d.getDate()-dow);start.setHours(0,0,0,0);
      end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);
      label=t('week_prefix')+' '+start.toLocaleDateString(dloc(),{day:'numeric',month:'numeric'});
    }else if(period==='monthly'){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      start=new Date(d);end=new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999);
      label=d.toLocaleDateString(dloc(),{month:'short',year:'2-digit'});
    }else if(period==='quarterly'){
      const q=Math.floor(now.getMonth()/3)-i;const yr=now.getFullYear()+Math.floor(q/4);const qi=((q%4)+4)%4;
      start=new Date(yr,qi*3,1);end=new Date(yr,qi*3+3,0,23,59,59,999);
      label=t('quarter_prefix')+(LANG==='en'?'':' ')+num(qi+1)+' '+num(String(yr).slice(2));
    }else{
      const yr=now.getFullYear()-i;start=new Date(yr,0,1);end=new Date(yr,11,31,23,59,59,999);
      label=num(yr);
    }
    const rounds=data.filter(r=>{const tt=new Date(r.ts);return tt>=start&&tt<=end;});
    buckets.push({label,rounds});
  }
  return buckets;
}
function periodLabel(p){return t('pl_'+p);}

function stRange(period){
  const now=new Date();let start,days;
  if(period==='daily'){start=new Date(now);start.setHours(0,0,0,0);days=1;}
  else if(period==='weekly'){start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);days=7;}
  else if(period==='monthly'){start=new Date(now.getFullYear(),now.getMonth(),1);days=Math.round((now-start)/864e5)+1;}
  else if(period==='quarterly'){const q=Math.floor(now.getMonth()/3);start=new Date(now.getFullYear(),q*3,1);days=Math.round((now-start)/864e5)+1;}
  else {start=new Date(now.getFullYear(),0,1);days=Math.round((now-start)/864e5)+1;}
  return {start,days:Math.max(1,days)};
}
function dayKey(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

function staffStats(){
  const {start}=stRange(stPeriod);
  let data=scopedRounds().filter(r=>new Date(r.ts)>=start);
  if(stDept!=='all')data=data.filter(r=>r.dept===stDept);
  const map={};
  const keyOf=r=>r.techUid||('name:'+(r.tech||'—'));
  data.forEach(r=>{
    const k=keyOf(r);
    if(!map[k])map[k]={key:k,name:r.tech||'—',dept:r.dept,rounds:[],days:{},issues:0,res:0,esc:0};
    const m=map[k];
    m.rounds.push(r);m.dept=r.dept;
    m.days[dayKey(r.ts)]=(m.days[dayKey(r.ts)]||0)+1;
    m.issues+=r.problems.length;
    m.res+=r.problems.filter(p=>p.status==='resolved').length;
    m.esc+=r.problems.filter(p=>p.status==='escalated').length;
  });
  // staff in scope who recorded nothing this period
  STAFF.filter(u=>u.role==='tech'&&u.active!==false&&u.dept&&(stDept==='all'?userDepts(USER).includes(u.dept):u.dept===stDept))
    .forEach(u=>{ if(!map[u.uid]&&!Object.values(map).some(m=>m.name===u.name))
      map[u.uid]={key:u.uid,name:u.name||'—',dept:u.dept,rounds:[],days:{},issues:0,res:0,esc:0}; });
  return Object.values(map).map(m=>{
    const dl=Object.keys(m.days).length;
    return {...m,n:m.rounds.length,activeDays:dl,
      perDay:dl?m.rounds.length/dl:0,
      avg:periodAvg(m.rounds),
      last:m.rounds.length?m.rounds.map(r=>r.ts).sort().slice(-1)[0]:null};
  }).sort((a,b)=>b.n-a.n||(a.name>b.name?1:-1));
}

/* ---- Excel export (styled .xlsx via ExcelJS, loaded on demand) ---- */
const XL={ink:'FF0D3B45',teal:'FF0E8A8A',tealSoft:'FFE2F2F1',line:'FFD9E4E6',white:'FFFFFFFF',
  green:'FF1F9D6B',greenSoft:'FFE4F6EE',amber:'FFE39A1F',amberSoft:'FFFDF1DC',coral:'FFE0523A',coralSoft:'FFFCE7E2',
  band:'FFF7FAFA',muted:'FF6B8189'};
function xlLoad(){
  return new Promise((res,rej)=>{
    if(window.ExcelJS)return res(window.ExcelJS);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    sc.onload=()=>window.ExcelJS?res(window.ExcelJS):rej(new Error('no lib'));
    sc.onerror=()=>rej(new Error('load fail'));
    document.head.appendChild(sc);
  });
}
// real Excel date serial → sorts & filters as a date in every environment
function xlDate(ts){const d=new Date(ts);const off=d.getTimezoneOffset()*60000;return (d.getTime()-off)/86400000+25569;}
function xlBorder(c){const e={style:'thin',color:{argb:XL.line}};return {top:e,left:e,bottom:e,right:e};}
function xlHeadRow(ws,row,h){
  row.height=h||30;
  row.eachCell(c=>{
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.ink}};
    c.font={bold:true,color:{argb:XL.white},size:11};
    c.alignment={vertical:'middle',horizontal:'center',wrapText:true};
    c.border=xlBorder();
  });
}
function xlScoreColor(v){return v>=4?[XL.greenSoft,XL.green]:v>=3?[XL.amberSoft,'FF8A5F0E']:[XL.coralSoft,XL.coral];}
async function exportCSV(){ // kept name: called from the toolbar button
  if(!canExport(USER)){toast(t('err_noperm_export'),'err');return;}
  const list=scopedRounds();
  if(!list.length){toast(t('no_data_export'),'err');return;}
  toast(t('exporting'),'');
  let EJS;
  try{ EJS=await xlLoad(); }catch(e){ console.error(e); toast(t('err_export_lib'),'err'); return; }

  const rtl=(LANG==='ar');
  const wb=new EJS.Workbook();
  wb.creator='Patient Satisfaction Rounds';wb.created=new Date();

  /* ============ SHEET 1 — rounds ============ */
  const ws=wb.addWorksheet(t('sh_rounds'),{views:[{rightToLeft:rtl,state:'frozen',ySplit:1}],
    pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  const qCols=QRATED.map(q=>({header:qLabel(q),key:q.k,width:17}));
  ws.columns=[
    {header:t('th_date'),key:'date',width:19},
    {header:t('th_dept'),key:'dept',width:28},
    {header:t('th_room'),key:'room',width:10},
    {header:t('th_pname'),key:'pname',width:22},
    {header:t('th_mrn'),key:'mrn',width:14},
    {header:t('th_asked'),key:'ptype',width:11},
    {header:t('th_tech'),key:'tech',width:18},
    ...qCols,
    {header:t('th_overall'),key:'overall',width:13},
    {header:t('th_avg'),key:'avg',width:11},
    {header:t('th_nissues'),key:'np',width:11},
    {header:t('th_resolved_n'),key:'nr',width:11},
    {header:t('th_esc_n'),key:'ne',width:11},
    {header:t('th_liked'),key:'liked',width:34},
    {header:t('th_sugg'),key:'sugg',width:34},
    {header:t('th_nurse'),key:'nurse',width:20}
  ];
  xlHeadRow(ws,ws.getRow(1),62);   // rated-item questions are long → taller header
  list.forEach((r,i)=>{
    const row=ws.addRow({date:xlDate(r.ts),dept:deptLabel(r.dept),room:r.room,pname:r.pname||'',mrn:r.mrn||'',ptype:ptypeLabel(r.ptype),tech:r.tech||'',
      q3:r.ratings.q3||null,q4:r.ratings.q4||null,q5:r.ratings.q5||null,q6:r.ratings.q6||null,q7:r.ratings.q7||null,q8:r.ratings.q8||null,
      overall:r.ratings.overall||null,avg:roundAvg(r)?Number(roundAvg(r).toFixed(2)):null,
      np:r.problems.length,nr:r.problems.filter(p=>p.status==='resolved').length,
      ne:r.problems.filter(p=>p.status==='escalated').length,
      liked:r.liked||'',sugg:r.suggestions||'',nurse:r.nurse||''});
    row.height=20;
    row.eachCell({includeEmpty:true},c=>{
      c.border=xlBorder();
      c.alignment={vertical:'middle',horizontal:'center',wrapText:false};
      if(i%2===1)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.band}};
    });
    row.getCell('date').numFmt='yyyy-mm-dd hh:mm';
    ['liked','sugg'].forEach(k=>{row.getCell(k).alignment={vertical:'middle',horizontal:rtl?'right':'left',wrapText:true};});
    ['dept','pname'].forEach(k=>{row.getCell(k).alignment={vertical:'middle',horizontal:rtl?'right':'left'};});
    // colour the rating cells
    [...QRATED.map(q=>q.k),'overall','avg'].forEach(k=>{
      const c=row.getCell(k);const v=Number(c.value);
      if(v){const [bg,fg]=xlScoreColor(v);
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};
        c.font={bold:true,color:{argb:fg}};}
    });
    const ce=row.getCell('ne');
    if(Number(ce.value)>0){ce.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.amberSoft}};ce.font={bold:true,color:{argb:'FF8A5F0E'}};}
  });
  ws.autoFilter={from:{row:1,column:1},to:{row:1,column:ws.columns.length}};

  /* ============ SHEET 2 — issues ============ */
  const probs=[];
  list.forEach(r=>r.problems.forEach(p=>probs.push({p,r})));
  if(probs.length){
    const w2=wb.addWorksheet(t('sh_issues'),{views:[{rightToLeft:rtl,state:'frozen',ySplit:1}],
      pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
    w2.columns=[
      {header:t('th_date'),key:'date',width:19},
      {header:t('th_dept'),key:'dept',width:26},
      {header:t('th_room'),key:'room',width:10},
      {header:t('th_pname'),key:'pname',width:22},
      {header:t('th_mrn'),key:'mrn',width:14},
      {header:t('th_issue'),key:'issue',width:40},
      {header:t('th_status2'),key:'st',width:14},
      {header:t('th_desc'),key:'desc',width:34},
      {header:t('th_plan'),key:'plan',width:42},
      {header:t('th_by'),key:'by',width:20}
    ];
    xlHeadRow(w2,w2.getRow(1));
    probs.forEach(({p,r},i)=>{
      const st=p.status==='resolved'?t('bar_resolved'):p.status==='escalated'?t('bar_escalated'):t('bar_open');
      const row=w2.addRow({date:xlDate(r.ts),dept:deptLabel(r.dept),room:r.room,pname:r.pname||'',mrn:r.mrn||'',issue:probLabel(p),st,
        desc:p.note||'',plan:p.actionSup||p.actionTech||'',by:p.supName||p.handledBy||r.tech||''});
      row.height=20;
      row.eachCell({includeEmpty:true},c=>{
        c.border=xlBorder();
        c.alignment={vertical:'middle',horizontal:rtl?'right':'left',wrapText:true};
        if(i%2===1)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.band}};
      });
      row.getCell('date').numFmt='yyyy-mm-dd hh:mm';
      row.getCell('date').alignment={vertical:'middle',horizontal:'center'};
      row.getCell('room').alignment={vertical:'middle',horizontal:'center'};
      const c=row.getCell('st');
      const pal=p.status==='resolved'?[XL.greenSoft,XL.green]:p.status==='escalated'?[XL.amberSoft,'FF8A5F0E']:[XL.coralSoft,XL.coral];
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:pal[0]}};
      c.font={bold:true,color:{argb:pal[1]}};
      c.alignment={vertical:'middle',horizontal:'center'};
    });
    w2.autoFilter={from:{row:1,column:1},to:{row:1,column:w2.columns.length}};
  }

  /* ============ SHEET 3 — summary ============ */
  const w3=wb.addWorksheet(t('sh_summary'),{views:[{rightToLeft:rtl,showGridLines:false}]});
  w3.columns=[{width:38},{width:20},{width:16}];
  const allP=[];list.forEach(r=>r.problems.forEach(p=>allP.push(p)));
  const done=allP.filter(p=>p.status==='resolved').length;
  const openN=allP.length-done;
  const overallAvg=periodAvg(list);
  const scopeTxt=seesAllDepts(USER)?t('all_departments'):userDepts(USER).map(deptLabel).join('، ');

  const nrow=()=>w3.addRow({});          // explicit cell writes — no array reliance
  const title=nrow();
  title.height=38;
  w3.mergeCells(title.number,1,title.number,3);
  const tc=w3.getCell(title.number,1);
  tc.value=t('xl_title');
  tc.font={bold:true,size:16,color:{argb:XL.white}};
  tc.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.ink}};
  tc.alignment={vertical:'middle',horizontal:'center'};
  nrow();

  const kv=(label,val,accent)=>{
    const row=nrow();
    row.height=22;
    const a=row.getCell(1),b=row.getCell(2);
    a.value=label;b.value=val;
    a.font={bold:true,color:{argb:XL.ink}};
    a.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.tealSoft}};
    a.alignment={vertical:'middle',horizontal:rtl?'right':'left'};
    b.alignment={vertical:'middle',horizontal:'center'};
    b.font={bold:true,size:12,color:{argb:accent||XL.ink}};
    a.border=xlBorder();b.border=xlBorder();
    return row;
  };
  kv(t('xl_generated'),xlDate(Date.now())).getCell(2).numFmt='yyyy-mm-dd hh:mm';
  kv(t('xl_scope'),scopeTxt);
  kv(t('xl_count'),list.length);
  kv(t('xl_avg'),overallAvg?Number(overallAvg.toFixed(2)):'—',overallAvg?xlScoreColor(overallAvg)[1]:XL.muted);
  kv(t('xl_issues_total'),allP.length);
  kv(t('xl_issues_open'),openN,openN?XL.coral:XL.green);
  kv(t('xl_issues_done'),done,XL.green);

  const section=txt=>{
    nrow();
    const r=nrow();
    w3.mergeCells(r.number,1,r.number,3);
    r.height=26;
    const c=w3.getCell(r.number,1);
    c.value=txt;
    c.font={bold:true,size:12,color:{argb:XL.white}};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.teal}};
    c.alignment={vertical:'middle',horizontal:'center'};
  };
  const tableHead=(cols)=>{
    const r=nrow();r.height=24;
    for(let i=0;i<3;i++){
      const c=r.getCell(i+1);c.value=cols[i]!=null?cols[i]:'';
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.tealSoft}};
      c.font={bold:true,color:{argb:XL.ink}};c.border=xlBorder();
      c.alignment={vertical:'middle',horizontal:'center'};
    }
  };
  const dataRow=(cells,scoreIdx)=>{
    const r=nrow();r.height=20;
    for(let i=0;i<3;i++){
      const c=r.getCell(i+1);c.value=cells[i]!=null?cells[i]:'';
      c.border=xlBorder();c.alignment={vertical:'middle',horizontal:'center'};
    }
    r.getCell(1).alignment={vertical:'middle',horizontal:rtl?'right':'left'};
    if(scoreIdx){const c=r.getCell(scoreIdx);const v=Number(c.value);
      if(v){const [bg,fg]=xlScoreColor(v);c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};c.font={bold:true,color:{argb:fg}};}}
  };

  // by department
  section(t('xl_by_dept'));
  tableHead([t('th_dept'),t('kpi_roundscount'),t('xl_avg_short')]);
  userDepts(USER).map(d=>({d,rs:list.filter(r=>r.dept===d)})).filter(x=>x.rs.length)
    .sort((a,b)=>b.rs.length-a.rs.length)
    .forEach(({d,rs})=>{const a=periodAvg(rs);dataRow([deptLabel(d),rs.length,a?Number(a.toFixed(2)):'—'],3);});

  // by question
  section(t('xl_by_q'));
  tableHead([t('xl_item'),t('xl_avg_short'),'']);
  QRATED.forEach(q=>{
    const vals=list.map(r=>r.ratings[q.k]).filter(v=>v);
    const a=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:0;
    dataRow([qLabel(q),a?Number(a.toFixed(2)):'—',''],2);
  });

  /* ============ download ============ */
  try{
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const d=new Date(),pad=n=>String(n).padStart(2,'0');
    const stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(LANG==='en'?'patient_satisfaction_rounds_':'جولات_رضا_المرضى_')+stamp+'.xlsx';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast(t('toast_exported'),'ok');
  }catch(e){console.error(e);toast(t('err_export_lib'),'err');}
}

/* ================= USER MANAGEMENT (admin) ================= */
let USERS=[];
async function loadUsers(){
  if(!cloud){USERS=[];return;}
  const snap=await db.collection(UC).get();
  const order={admin:0,sup:1,head:2,tech:3};
  USERS=snap.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>(order[a.role]??9)-(order[b.role]??9));
}
async function viewUsers(){
  const app=$('#app');editUid=null;
  if(!canManageUsers(USER)){app.innerHTML=emptyCard('🔒',t('um_locked_title'),t('um_locked_sub'));return;}
  app.innerHTML=`<div class="page-head"><div><h2>${t('um_title')}</h2><p>${t('um_sub')}</p></div></div>
    <div id="usersBody"><div class="empty"><div class="ic">⏳</div><h3>${t('loading')}</h3></div></div>`;
  await loadUsers();renderUsers();
}
let editUid=null;
function startEdit(uid){editUid=uid;renderUsers();window.scrollTo({top:0,behavior:'smooth'});}
function cancelEdit(){editUid=null;renderUsers();}

  const box=$('#usersBody');if(!box)return;
  const ed=editUid?USERS.find(u=>u.uid===editUid):null;
  if(ed)return renderEditForm(box,ed);
  let html=`<div class="card card-pad" style="margin-bottom:20px">
    <div class="section-title" style="margin-top:0">${t('add_staff')}</div>
    <div class="grid3">
      <div><label class="fld req">${t('f_name')}</label><input type="text" id="nu_name" placeholder="${t('f_name_ph')}"></div>
      <div><label class="fld req">${t('email')}</label><input type="text" id="nu_email" placeholder="name@example.com" autocomplete="off"></div>
      <div><label class="fld req">${t('f_temp_pass')}</label><input type="text" id="nu_pass" placeholder="${t('f_pass_ph')}" autocomplete="off"></div>
    </div>
    <div style="margin-top:14px"><label class="fld req">${t('f_role')}</label>
      <select id="nu_role" onchange="toggleDeptField()" style="max-width:320px">
        ${['tech','head','sup','admin'].map(r=>`<option value="${r}">${roleLabel(r)}</option>`).join('')}
      </select></div>
    <div id="nu_deptWrap" style="margin-top:14px"></div>
    <div style="margin-top:16px"><button class="btn btn-primary btn-sm" id="addUserBtn" onclick="addUser()">${t('create_account')}</button></div>
    <p class="hint" id="userMsg" style="min-height:16px;font-weight:700"></p>
  </div>`;
  html+=`<div class="section-title">${t('accounts_word',{n:num(USERS.length)})}</div>
    <div class="card"><div style="overflow-x:auto"><table><thead><tr><th>${t('th_name')}</th><th>${t('th_email')}</th><th>${t('th_role')}</th><th>${t('th_dept2')}</th><th>${t('th_status')}</th><th></th></tr></thead><tbody>`;
  if(!USERS.length){html+=`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">${t('no_users')}</td></tr>`;}
  USERS.forEach(u=>{
    html+=`<tr>
      <td><b>${esc(u.name||'')}</b></td>
      <td>${esc(u.email||'')}</td>
      <td><span class="tag">${ROLE_IC[u.role]||''} ${roleLabel(u.role)}</span></td>
      <td>${seesAllDepts(u)?t('all_departments'):(isMultiDept(u)?t('n_departments',{n:num(userDepts(u).length)}):esc(deptLabel(u.dept||'')))}</td>
      <td>${u.active===false?'<span class="status st-esc">'+t('st_disabled')+'</span>':'<span class="status st-res">'+t('st_active')+'</span>'}</td>
      <td><div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="startEdit('${u.uid}')">${t('btn_edit')}</button>
        ${u.uid===USER.uid?'<span class="hint" style="align-self:center">'+t('you_label')+'</span>':(u.active===false
          ?`<button class="btn btn-green btn-sm" onclick="enableUser('${u.uid}')">${t('btn_enable')}</button>`
          :`<button class="btn btn-outline btn-sm" onclick="disableUser('${u.uid}','${esc((u.name||'').replace(/'/g,''))}')">${t('btn_disable')}</button>`)}
      </div></td>
    </tr>`;
  });
  html+=`</tbody></table></div></div>
    <p class="hint" style="margin-top:14px">${t('hint_disabled_note')}</p>`;
  box.innerHTML=html;
  labelCells(box);
  toggleDeptField();
}
function renderEditForm(box,u){
  const self=u.uid===USER.uid;
  box.innerHTML=`<div class="card card-pad" style="margin-bottom:20px">
    <div class="section-title" style="margin-top:0">${t('edit_title')} — ${esc(u.email||'')}</div>
    <div class="grid3">
      <div><label class="fld req">${t('f_name')}</label><input type="text" id="nu_name" value="${esc(u.name||'')}"></div>
      <div><label class="fld">${t('email')}</label><input type="text" value="${esc(u.email||'')}" disabled></div>
    </div>
    <div style="margin-top:14px"><label class="fld req">${t('f_role')}</label>
      <select id="nu_role" onchange="toggleDeptField()" style="max-width:320px"${self?' disabled':''}>
        ${['tech','head','sup','admin'].map(r=>`<option value="${r}"${u.role===r?' selected':''}>${roleLabel(r)}</option>`).join('')}
      </select>
      ${self?`<p class="hint">${t('self_role_note')}</p>`:''}</div>
    <div id="nu_deptWrap" style="margin-top:14px"></div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-primary btn-sm" id="saveUserBtn" onclick="saveEdit()">${t('save_changes')}</button>
      <button class="btn btn-outline btn-sm" onclick="cancelEdit()">${t('btn_cancel')}</button>
    </div>
    <p class="hint" id="userMsg" style="min-height:16px;font-weight:700"></p>
  </div>`;
  toggleDeptField({dept:u.dept,depts:(u.depts==null&&(u.role==='sup'||u.role==='admin'))?['*']:u.depts,role:u.role});
}
async function saveEdit(){
  const u=USERS.find(x=>x.uid===editUid);if(!u)return;
  const name=$('#nu_name').value.trim();
  const role=$('#nu_role').disabled?u.role:$('#nu_role').value;
  const msg=m=>{const e=$('#userMsg');if(e){e.style.color='var(--coral)';e.textContent=m;}};
  if(!name){msg(t('err_fill_user'));return;}
  const upd={name,role};
  const DEL=(typeof firebase!=='undefined'&&firebase.firestore)?firebase.firestore.FieldValue.delete():null;
  if(role==='tech'||role==='head'){
    upd.dept=$('#nu_dept').value; if(DEL)upd.depts=DEL;
  }else{
    const checked=[...document.querySelectorAll('#nu_depts input:checked')].map(i=>i.value);
    if(!checked.length){msg(t('err_pick_dept'));return;}
    upd.depts=checked.includes('*')?['*']:checked; if(DEL)upd.dept=DEL;
  }
  const b=$('#saveUserBtn');if(b){b.disabled=true;b.textContent=t('creating');}
  try{
    await db.collection(UC).doc(editUid).update(upd);
    if(editUid===USER.uid)USER={...USER,...upd};
    editUid=null;toast(t('toast_user_updated'),'ok');
    await loadUsers();renderUsers();buildTabs();
  }catch(e){console.error(e);msg(t('err_delete'));if(b){b.disabled=false;b.textContent=t('save_changes');}}
}
function toggleDeptField(pre){
  const role=$('#nu_role'),wrap=$('#nu_deptWrap');if(!role||!wrap)return;
  const r=role.value;
  const curDept=pre&&pre.dept?pre.dept:null;
  const curDepts=pre&&pre.depts?pre.depts:null;
  if(r==='tech'||r==='head'){
    wrap.innerHTML=`<label class="fld req">${t('f_dept')}</label>
      <select id="nu_dept" style="max-width:460px">${DEPTS.map(d=>`<option value="${esc(d.ar)}"${curDept===d.ar?' selected':''}>${esc(deptLabel(d.ar))}</option>`).join('')}</select>`;
  }else{
    const all=(curDepts==null)?false:curDepts.includes('*');
    wrap.innerHTML=`<label class="fld req">${t('f_dept_allowed')}</label>
      <div class="deptchecks" id="nu_depts">
        <label class="dchk all"><input type="checkbox" value="*"${all?' checked':''} onchange="toggleAllDepts(this)"> <b>${t('all_departments')}</b></label>
        ${DEPTS.map(d=>`<label class="dchk"><input type="checkbox" value="${esc(d.ar)}"${(!all&&curDepts&&curDepts.includes(d.ar))?' checked':''}${all?' disabled':''}> ${esc(deptLabel(d.ar))}</label>`).join('')}
      </div>
      <p class="hint">${t('depts_hint')}</p>`;
  }
}
function toggleAllDepts(cb){
  const box=$('#nu_depts');if(!box)return;
  box.querySelectorAll('input[type=checkbox]').forEach(i=>{if(i.value!=='*'){i.disabled=cb.checked;if(cb.checked)i.checked=false;}});
}
async function addUser(){
  const name=$('#nu_name').value.trim();
  const email=$('#nu_email').value.trim().toLowerCase();
  const pass=$('#nu_pass').value;
  const role=$('#nu_role').value;
  const msg=m=>{const e=$('#userMsg');if(e){e.style.color='var(--coral)';e.textContent=m;}};
  if(!name||!email||!pass){msg(t('err_fill_user'));return;}
  if(pass.length<6){msg(t('err_pass_short'));return;}
  let profDept=null,profDepts=null;
  if(role==='tech'||role==='head'){profDept=$('#nu_dept').value;}
  else{
    const checked=[...document.querySelectorAll('#nu_depts input:checked')].map(i=>i.value);
    if(!checked.length){msg(t('err_pick_dept'));return;}
    profDepts=checked.includes('*')?['*']:checked;
  }
  // already listed in this system? then it's a real duplicate
  if(USERS.some(u=>(u.email||'').toLowerCase()===email)){msg(t('err_email_active'));return;}

  const btn=$('#addUserBtn');btn.disabled=true;btn.textContent=t('creating');
  const prof={name,email,role,active:true,createdAt:new Date().toISOString(),createdBy:USER.email||''};
  if(profDept!=null)prof.dept=profDept; else prof.depts=profDepts;
  try{
    const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(firebaseConfig,'sec');
    let uid=null,restored=false;
    try{
      const cred=await sec.auth().createUserWithEmailAndPassword(email,pass);
      uid=cred.user.uid;
    }catch(e1){
      if(e1&&e1.code==='auth/email-already-in-use'){
        // sign-in account exists from before but has no profile here → restore it
        try{
          const cred=await sec.auth().signInWithEmailAndPassword(email,pass);
          uid=cred.user.uid;restored=true;
        }catch(e2){ throw {code:'restore-failed'}; }
      } else { throw e1; }
    }
    await sec.auth().signOut();
    await db.collection(UC).doc(uid).set(prof);
    $('#nu_name').value='';$('#nu_email').value='';$('#nu_pass').value='';
    toast(t(restored?'toast_access_restored':'toast_account_created'),'ok');
    await loadUsers();renderUsers();
  }catch(e){console.error(e);msg(e&&e.code==='restore-failed'?t('err_restore_pass'):authErr(e));}
  finally{const b=$('#addUserBtn');if(b){b.disabled=false;b.textContent=t('create_account');}}
}
async function disableUser(uid,name){
  if(uid===USER.uid){toast(t('err_cant_revoke_self'),'err');return;}
  if(!confirm(t('confirm_disable',{name:name})))return;
  try{await db.collection(UC).doc(uid).set({active:false},{merge:true});toast(t('toast_disabled'),'ok');await loadUsers();renderUsers();}
  catch(e){console.error(e);toast(t('err_delete'),'err');}
}
async function enableUser(uid){
  try{await db.collection(UC).doc(uid).set({active:true},{merge:true});toast(t('toast_enabled'),'ok');await loadUsers();renderUsers();}
  catch(e){console.error(e);toast(t('err_delete'),'err');}
}

/* ================= INIT ================= */
applyLang();
initDB(); // Firebase auth listener drives login/boot
</script>
</body>
</html>
