<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معك | مستشفى الجبيل العام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
/* Mobile networks often drop one of the three SDK files. Re-fetch whatever is missing. */
window.__fbParts=[
  ['app','https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'],
  ['auth','https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'],
  ['firestore','https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'],
  ['storage','https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js']
];
window.__fbMissing=function(){
  if(!window.firebase)return ['app','auth','firestore'];
  return ['auth','firestore'].filter(k=>typeof window.firebase[k]!=='function');
};
window.__fbReload=function(){
  const miss=window.__fbMissing();
  if(!miss.length)return Promise.resolve(true);
  return Promise.all(window.__fbParts.filter(p=>miss.includes(p[0])||miss.includes('app')).map(([k,url])=>
    new Promise(res=>{
      let done=false;
      const finish=v=>{if(!done){done=true;res(v);}};
      const sc=document.createElement('script');
      sc.src=url+'?r='+Date.now();
      sc.onload=()=>finish(true);
      sc.onerror=()=>finish(false);
      setTimeout(()=>finish(false),12000);   // never hang on a stalled mobile connection
      document.head.appendChild(sc);
    })
  )).then(()=>window.__fbMissing().length===0);
};
</script>
<style>
:root{
  --ink:#4A6591;        /* header — light navy */
  --ink-2:#4A6591;      /* flat: no gradient */
  --ink-deep:#33486B;   /* headings / active tab */
  --teal:#35699F;       /* primary accent */
  --teal-soft:#E9EFF8;
  --bg:#FAFCFD;
  --surface:#ffffff;
  --line:#DDE6F0;
  --muted:#82909F;
  --text:#243447;
  --coral:#e0523a;      /* problem / low */
  --coral-soft:#fdeae6;
  --amber:#e39a1f;      /* escalated */
  --amber-soft:#fcf1dc;
  --green:#1f9d6b;      /* resolved / high */
  --green-soft:#e2f4ec;
  --shadow:0 1px 2px rgba(42,63,99,.05),0 5px 16px rgba(42,63,99,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:800;color:var(--ink)}
.hidden{display:none !important}

/* ---------- Header ---------- */
header.top{
  background:var(--ink);
  color:#fff;padding:0 20px;position:sticky;top:0;z-index:50;
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 2px 10px rgba(42,63,99,.14);
}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:78px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;font-weight:700;font-size:18px}
.logo-lockup{display:flex;align-items:center;gap:13px}
.logo-lockup img{display:block}
.logo-proj{height:46px}
.logo-hosp{height:38px}
.logo-sep{width:1px;align-self:stretch;margin:5px 0;background:rgba(255,255,255,.28)}
.brand small{display:block;font-weight:400;font-size:11.5px;opacity:.8;margin-top:1px;letter-spacing:.1px}
.brand .tagline{display:block;font-weight:400;font-size:11.5px;opacity:.72;margin-top:2px}
.top-spacer{flex:1}
.userchip{
  display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.13);
  padding:6px 12px;border-radius:8px;font-size:13px;border:1px solid rgba(255,255,255,.16)
}
.userchip .av{width:25px;height:25px;border-radius:6px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700;font-size:12px}
.userchip .role{opacity:.72;font-size:11.5px}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);padding:7px 12px;border-radius:7px;font-size:13px;font-weight:500}
.dbstatus{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.18)}
.dbstatus::before{content:"";width:8px;height:8px;border-radius:50%;background:#9fb3b8}
.dbstatus.cloud{background:rgba(31,157,107,.22)}
.dbstatus.cloud::before{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.dbstatus.local{background:rgba(255,255,255,.1)}
.agechip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:5px;white-space:nowrap}
.agechip.ok{background:var(--teal-soft);color:var(--ink-deep)}
.agechip.warn{background:var(--amber-soft);color:#8a5f0e}
.agechip.crit{background:var(--coral-soft);color:#a83320}
.rowcrit{border-inline-start:3px solid var(--coral)}
.rowwarn{border-inline-start:3px solid var(--amber)}
.dbstatus.pending{background:rgba(227,154,31,.28)}
.dbstatus.pending::before{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.btn-ghost:hover{background:rgba(255,255,255,.2)}

/* ---------- Nav ---------- */
nav.tabs{background:#F1F5FA;border-bottom:1px solid var(--line);position:sticky;top:78px;z-index:40}
.tabs-inner{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding:0 16px;overflow-x:auto}
.tab{
  border:none;background:none;padding:14px 15px 11px;font-size:14px;font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px
}
.tab .ic{display:inline-flex;width:17px;height:17px;flex:none}
.tab .ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab .badge{background:var(--coral);color:#fff;border-radius:5px;font-size:11px;padding:1px 6px;font-weight:700}
.tab.active{color:var(--ink-deep);border-bottom-color:var(--teal)}
.tab:hover{color:var(--ink-deep)}

/* ---------- Layout ---------- */
main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:23px}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow)}
.card-pad{padding:22px}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:8px;padding:12px 20px;font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#0b7676}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-outline:hover{border-color:var(--teal);color:var(--teal)}
.btn-coral{background:var(--coral);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Forms ---------- */
label.fld{display:block;font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:7px}
.req::after{content:" *";color:var(--coral)}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:7px;font-family:inherit;font-size:14.5px;
  background:#fbfdfd;color:var(--text);transition:.15s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px var(--teal-soft)}
.pass-wrap{position:relative;display:block}
.pass-wrap input{width:100%;padding-inline-end:44px}
.pass-eye{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:6px;width:32px;height:32px;display:grid;place-items:center;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:6px;padding:0}
.pass-eye:hover{color:var(--teal);background:var(--teal-soft)}
.pass-eye.on{color:var(--teal)}
.link-btn{border:none;background:none;color:var(--teal);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:2px 0;text-decoration:none}
.link-btn:hover{text-decoration:underline}
.link-btn:disabled{opacity:.5;cursor:default;text-decoration:none}
.month-sel{padding:8px 12px;border:1.5px solid var(--line);border-radius:7px;background:#fff;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;width:auto;min-width:150px}
.month-sel:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-opt{flex:1;min-width:110px;border:1.5px solid var(--line);background:#fbfdfd;border-radius:7px;padding:11px;text-align:center;font-weight:700;font-size:14px;color:var(--text)}
.seg-opt.on{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.lockchip{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px dashed var(--line);background:#f3f7f8;border-radius:7px;padding:11px 13px;font-weight:800;color:var(--ink)}
.pc-lock{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--ink-deep);border:1px solid var(--line);border-radius:7px;padding:8px 13px;font-size:13px;font-weight:600}
.lockchip span{opacity:.5;font-size:13px}
.deptchecks{display:flex;flex-wrap:wrap;gap:8px;max-height:190px;overflow:auto;border:1.5px solid var(--line);border-radius:8px;padding:12px;background:#fbfdfd}
.dchk{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;user-select:none}
.dchk:hover{border-color:var(--teal)}
.dchk input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}
.dchk.all{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}
.dchk input:disabled+*{opacity:.5}

/* ---------- Rating scale ---------- */
.qblock{border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:14px;background:#fbfdfd}
.qblock.flagged{border-color:var(--coral);background:var(--coral-soft)}
.qtitle{font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.qtitle .n{background:var(--ink);color:#fff;border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center;font-size:12.5px;flex:none}
.scale{display:flex;gap:7px}
.dot{
  flex:1;border:1.5px solid var(--line);background:#fff;border-radius:7px;padding:9px 4px;text-align:center;
  font-size:12.5px;font-weight:700;color:var(--muted);transition:.12s;line-height:1.25
}
.dot .num{display:block;font-size:16px;margin-bottom:1px}
.dot:hover{border-color:var(--teal)}
.dot.sel-5{border-color:var(--green);background:var(--green-soft);color:#146b48}
.dot.sel-4{border-color:var(--green);background:var(--green-soft);color:#146b48}
.dot.sel-3{border-color:var(--amber);background:var(--amber-soft);color:#8a5f0e}
.dot.sel-2{border-color:var(--coral);background:var(--coral-soft);color:#a83320}
.dot.sel-1{border-color:var(--coral);background:var(--coral-soft);color:#a83320}
.flag-note{margin-top:11px;font-size:13px;color:#a83320;font-weight:700;display:flex;align-items:center;gap:6px}
.qtitle .qtext{flex:1}
.rubric-btn{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;line-height:1;padding:0}
.rubric-btn:hover{border-color:var(--teal);color:var(--teal)}
.anchor{font-size:12px;color:var(--muted);margin:-4px 0 12px;padding-inline-start:34px}
.scale-desc{margin-top:10px;min-height:20px;font-size:13px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.ds-badge{font-weight:800;border-radius:6px;padding:2px 9px;font-size:12.5px;white-space:nowrap}
.ds-long{color:var(--text)}
.ds-badge.sel-5{background:var(--green-soft);color:#146b48}
.ds-badge.sel-4{background:#e8f4ec;color:#2f7d55}
.ds-badge.sel-3{background:var(--amber-soft);color:#8a5f0e}
.ds-badge.sel-2{background:#fbe9df;color:#a85a26}
.ds-badge.sel-1{background:var(--coral-soft);color:#a83320}
.rub-overlay{display:none;position:fixed;inset:0;background:rgba(35,53,88,.5);backdrop-filter:blur(3px);place-items:center;z-index:120;padding:18px}
.rub-box{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:20px;box-shadow:0 24px 60px rgba(35,53,88,.3);max-height:85vh;overflow-y:auto}
.rep-overlay{position:fixed;inset:0;background:rgba(35,53,88,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:130;padding:18px}
.rep-box{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(35,53,88,.3);max-height:88vh;overflow-y:auto}
.rep-box-head{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;color:var(--ink-deep);margin-bottom:18px}
.rep-x{border:none;background:none;font-size:19px;color:var(--muted);cursor:pointer;padding:0;line-height:1}
.rep-field{margin-bottom:18px}
.rep-dept-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.rep-check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;padding:3px 0}
.rep-check input{width:17px;height:17px;accent-color:var(--teal);cursor:pointer;flex:none}
.rep-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.rep-actions .btn-ghost{background:var(--teal-soft);color:var(--ink-deep);border:1px solid var(--line)}
.rep-actions .btn-ghost:hover{background:#dde8f5}
.rub-modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;font-size:15px;color:var(--ink-deep)}
.rub-modal-head .x{border:none;background:none;font-size:18px;color:var(--muted);cursor:pointer;flex:none;padding:0;line-height:1}
.rub-row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.rub-row:last-child{border-bottom:none}
.rub-score{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px}
.rub-score.sel-5{background:var(--green-soft);color:#146b48}
.rub-score.sel-4{background:#e8f4ec;color:#2f7d55}
.rub-score.sel-3{background:var(--amber-soft);color:#8a5f0e}
.rub-score.sel-2{background:#fbe9df;color:#a85a26}
.rub-score.sel-1{background:var(--coral-soft);color:#a83320}

/* ---------- Problem cards ---------- */
.prob{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px;background:#fff}
.prob-head{padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prob-src{font-weight:800;color:var(--ink);font-size:14.5px}
.prob-body{padding:0 16px 16px}
.status{border-radius:30px;padding:4px 12px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:5px}
.st-open{background:var(--coral-soft);color:#a83320}
.st-esc{background:var(--amber-soft);color:#8a5f0e}
.st-res{background:var(--green-soft);color:#146b48}
.pill{background:var(--teal-soft);color:var(--ink);border-radius:30px;padding:3px 11px;font-size:12px;font-weight:700}
.choice{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.choice .btn{flex:1;min-width:150px;justify-content:center}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:17px 18px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
.kpi .val{font-size:30px;font-weight:800;color:var(--ink);line-height:1}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:6px}
.kpi.accent .val{color:var(--teal)}
.kpi.good .val{color:var(--green)}
.kpi.warn .val{color:var(--coral)}
.kpi.danger{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral) inset,var(--shadow)}
.kpi.danger .val{color:var(--coral)}

/* ---------- Chart ---------- */
.chartwrap{padding:6px 4px 0}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:46px;border-radius:9px 9px 4px 4px;background:linear-gradient(var(--teal),#0b7676);position:relative;transition:.4s;min-height:3px}
.bar span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:var(--ink)}
.bar-lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-align:center}

/* horizontal question bars */
.qbar{margin-bottom:13px}
.qbar-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
.qbar-top .sc{color:var(--muted)}
.track{height:12px;background:#eef3f4;border-radius:8px;overflow:hidden}
.fill{height:100%;border-radius:8px;transition:.5s}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:11px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:12.5px;background:#f8fbfb}
tbody tr:hover{background:#f8fbfb}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:44px;margin-bottom:10px}
.empty h3{color:var(--ink);margin-bottom:6px}

/* ---------- Modal / login ---------- */
.overlay{position:fixed;inset:0;background:rgba(13,59,69,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:9px;max-width:440px;width:100%;padding:0;overflow:hidden;box-shadow:0 24px 64px rgba(35,53,88,.28)}
.lg-crown{background:var(--ink);padding:24px 26px 20px;text-align:center}
.lg-quote{color:#fff;opacity:.9;font-size:13px;line-height:1.85;margin:16px 0 0;font-weight:400}
.lg-body{padding:26px}
.modal h2{font-size:20px;margin:0 0 6px}
.modal p.lead{color:var(--muted);margin:0 0 22px;font-size:14px}
.rolepick{display:grid;gap:10px;margin-bottom:18px}
.role-opt{border:1.5px solid var(--line);border-radius:9px;padding:14px 16px;display:flex;align-items:center;gap:13px;text-align:right}
[dir="ltr"] th,[dir="ltr"] td{text-align:left}
[dir="ltr"] .role-opt{text-align:left}
[dir="ltr"] input,[dir="ltr"] textarea,[dir="ltr"] select{text-align:left}
[dir="ltr"] .bar-lbl{direction:ltr}
.role-opt .ic{width:42px;height:42px;border-radius:8px;background:var(--teal-soft);display:grid;place-items:center;font-size:21px;flex:none}
.role-opt .t{font-weight:800;color:var(--ink);font-size:15px}
.role-opt .d{font-size:12.5px;color:var(--muted)}
.role-opt.on{border-color:var(--teal);background:var(--teal-soft)}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:8px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--coral)}
#toast.esc{background:var(--amber);color:#3a2a05}
.tab .badge.pulse{animation:badgePulse 1.1s ease-in-out infinite}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(224,82,58,.55)}50%{box-shadow:0 0 0 6px rgba(224,82,58,0)}}
.esc-banner{position:fixed;top:0;left:0;right:0;z-index:210;display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(90deg,var(--amber),#f0b03e);color:#3a2a05;font-weight:800;font-size:14px;
  padding:12px 18px;cursor:pointer;transform:translateY(-100%);transition:transform .35s;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.esc-banner.show{transform:translateY(0)}
.esc-banner .eb-ic{font-size:18px;animation:bellShake 1s ease-in-out infinite}
.esc-banner .eb-go{background:rgba(0,0,0,.14);border-radius:6px;padding:3px 10px;font-size:12.5px}
@keyframes bellShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.btn-wa{background:#25D366;color:#fff;border:0}
.ev-photo{max-width:180px;max-height:150px;border-radius:8px;border:1px solid var(--line);cursor:pointer;object-fit:cover;display:inline-block;vertical-align:middle}
.photo-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 14px;border:1.5px dashed var(--teal);border-radius:8px;color:var(--teal);font-size:14px;font-weight:600;cursor:pointer;background:#fff}
.photo-btn:hover{background:var(--teal-soft)}
.btn-wa:hover{background:#1eb658}
.wa-list{display:flex;flex-direction:column;gap:9px}
.wa-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;text-decoration:none;color:var(--text);transition:.15s;background:var(--bg)}
.wa-item:hover{border-color:#25D366;background:#f0fbf4}
.wa-av{width:38px;height:38px;border-radius:50%;background:var(--teal-soft);color:var(--ink-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto}
.wa-meta{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.wa-go{color:#1eb658;font-weight:800;font-size:13px;white-space:nowrap}

.section-title{font-size:16px;font-weight:800;color:var(--ink);margin:26px 0 14px;display:flex;align-items:center;gap:9px}
.section-title::before{content:"";width:4px;height:18px;background:var(--teal);border-radius:4px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.divider{height:1px;background:var(--line);margin:22px 0}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);background:#eef3f4;border-radius:8px;padding:3px 10px}

@media(max-width:720px){
  .grid2,.grid3{grid-template-columns:1fr}
  .page-head h2{font-size:20px}
  .kpi .val{font-size:25px}
  .scale{flex-wrap:wrap}
  .dot{min-width:56px}
}

/* ---------- Phones ---------- */
@media(max-width:640px){
  header.top{padding:0 12px}
  .top-inner{gap:8px;min-height:auto;padding:10px 0}
  .brand{font-size:15px;gap:10px;width:100%}
  .logo-lockup{gap:10px}
  .logo-proj{height:36px}
  .logo-hosp{height:30px}
  .brand small,.brand .tagline{font-size:10.5px}
  .lg-crown{padding:18px 18px 15px}
  .lg-quote{font-size:12px;line-height:1.75;margin-top:12px}
  .lg-body{padding:20px}
  .lg-crown .logo-proj{height:48px}
  .lg-crown .logo-hosp{height:40px}
  .top-spacer{display:none}
  .userchip{font-size:12px;padding:5px 10px;order:3}
  .userchip .role{display:none}
  .dbstatus{font-size:11px;padding:4px 9px}
  nav.tabs{position:sticky;top:0}
  .tabs-inner{padding:0 8px;gap:0}
  .tab{padding:13px 12px 10px;font-size:13.5px}
  main{padding:16px 12px 50px}
  .card-pad{padding:16px}
  .page-head{margin-bottom:16px}
  .page-head h2{font-size:19px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kpi{padding:13px 14px;border-radius:9px}
  .kpi .val{font-size:22px}
  .kpi .lbl{font-size:11.5px;margin-bottom:6px}
  .kpi .sub{font-size:11px}
  .btn{padding:13px 18px}
  .btn-sm{padding:10px 14px}
  .seg-opt{min-width:calc(50% - 4px);padding:13px 8px}
  .dot{min-width:calc(33.33% - 5px);padding:11px 4px}
  .qblock{padding:14px}
  .anchor{padding-inline-start:0}
  .rub-box{padding:16px}
  .qtitle{font-size:14px}
  .bars{height:150px;gap:6px}
  .bar-lbl{font-size:10px}
  .choice .btn{min-width:100%}
  .deptchecks{max-height:230px}
  .dchk{width:100%}

  /* tables become stacked cards — labels come from data-label */
  table,thead,tbody,tr,th,td{display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table{font-size:13.5px}
  tbody tr{
    border:1px solid var(--line);border-radius:9px;margin-bottom:11px;
    padding:6px 2px;background:#fff;box-shadow:0 1px 3px rgba(13,59,69,.05)
  }
  tbody tr:hover{background:#fff}
  tbody td{
    border:none;border-bottom:1px dashed var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:9px 13px;text-align:start
  }
  tbody td:last-child{border-bottom:none}
  tbody td::before{
    content:attr(data-label);font-size:12px;font-weight:700;color:var(--muted);
    flex:none;max-width:45%
  }
  tbody td:empty{display:none}
  tbody td.no-label::before{content:none}
  tbody td.no-label{justify-content:flex-end}

  .overlay{padding:14px;align-items:start;padding-top:32px;overflow-y:auto}
  .modal{padding:22px;border-radius:7px}
  .modal h2{font-size:19px}
}
/* iOS zooms the page when a field's text is under 16px — keep inputs at 16px */
@media(max-width:640px){
  input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{font-size:16px}
}
</style>

function seesAll(u){return isMultiDept(u);}
function userDepts(u){
  if(!u)return[];
  if(u.role==='tech'||u.role==='head')return u.dept?[u.dept]:[];
  if(u.role==='support')return [];               // support dept scoped by support-queue, not nursing depts
  // sup/admin/director: no depts field at all = legacy account → treat as all departments
  const d=(u.depts==null)?['*']:u.depts;
  return d.includes('*')?DEPT_AR.slice():d;
}
function seesAllDepts(u){return !!u&&isMultiDept(u)&&(u.depts==null||u.depts.includes('*'));}

function canManageUsers(u){return !!u&&u.role==='admin';}
function canExport(u){return !!u&&['head','sup','admin','director'].includes(u.role);}
function canDeleteRounds(u){return !!u&&(OWNER_UID?u.uid===OWNER_UID:u.role==='admin');}
function canSeeStaff(u){return !!u&&['head','sup','admin','director'].includes(u.role);}
function canDoRounds(u){return !!u&&u.role==='tech';}
function canEscalateExternal(u){return !!u&&['sup','admin','director'].includes(u.role);} // sup + admin + director
function isSupportDept(u){return !!u&&u.role==='support';}
function inScope(u,r){return !!r&&userDepts(u).includes(r.dept);}

let db=null, auth=null, storage=null, cloud=false, roundsSubbed=false;

/* ---- data layer (cloud only) ---- */
function saveLocal(){try{localStorage.setItem(LS_ROUNDS,JSON.stringify(ROUNDS));}catch(e){}}
const DB={
  save(round){
    const i=ROUNDS.findIndex(r=>r.id===round.id);
    if(i>=0)ROUNDS[i]=round; else ROUNDS.unshift(round);           // optimistic
    ROUNDS.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    if(cloud){db.collection(RC).doc(round.id).set(round).catch(e=>{console.error(e);toast(t('toast_cloud_savefail'),'err');});}
    else{saveLocal();}
  },
  async remove(id){
    if(cloud){
      try{ await db.collection(RC).doc(id).delete(); }
      catch(e){ console.error(e); toast(t('err_delete_round'),'err'); return false; }
    }
    ROUNDS=ROUNDS.filter(r=>r.id!==id);
    if(!cloud)saveLocal();
    return true;
  },
  async saveCount(rec){
    // rec: {id: dept__YYYY-MM-DD, dept, date, total, excluded, by, ts}
    PCOUNTS[rec.id]=rec;
    if(cloud){
      try{ await db.collection(PC).doc(rec.id).set(rec); }
      catch(e){ console.error(e); toast(t('toast_cloud_savefail'),'err'); return false; }
    }else{ saveLocalCounts(); }
    return true;
  }
};
/* patient-count records, keyed by dept__date */
let PCOUNTS={};
function countId(dept,date){return dept+'__'+date;}
function saveLocalCounts(){try{localStorage.setItem('jhn_pcounts_v1',JSON.stringify(PCOUNTS));}catch(e){}}
function loadLocalCounts(){try{const s=localStorage.getItem('jhn_pcounts_v1');if(s)PCOUNTS=JSON.parse(s);}catch(e){}}
let pcUnsubs=[];
function unsubscribeCounts(){pcUnsubs.forEach(u=>{try{u();}catch(e){}});pcUnsubs=[];for(const k in PCOUNTS)delete PCOUNTS[k];}
function subscribeCounts(){
  if(!cloud||!db){loadLocalCounts();return;}
  const errH=e=>console.error('counts:',e);
  if(seesAllDepts(USER)){
    pcUnsubs.push(db.collection(PC).onSnapshot(snap=>{
      for(const k in PCOUNTS)delete PCOUNTS[k];
      snap.docs.forEach(d=>{PCOUNTS[d.id]=d.data();});
      if(current==='dash'||current==='staff')render();
    },errH));
  }else{
    const ds=userDepts(USER);
    ds.forEach(d=>{
      pcUnsubs.push(db.collection(PC).where('dept','==',d).onSnapshot(snap=>{
        snap.docs.forEach(x=>{PCOUNTS[x.id]=x.data();});
        if(current==='dash'||current==='staff')render();
      },errH));
    });
  }
}

let PENDING=0, FROM_CACHE=false;
function setStatus(ok){
  const el=$('#dbstatus');if(!el)return;
  if(ok&&(PENDING>0||FROM_CACHE)){
    el.className='dbstatus pending';
    el.textContent=PENDING>0?t('status_pending',{n:num(PENDING)}):t('status_offline_ok');
    el.title=t('status_pending_hint');
    return;
  }
  el.className='dbstatus '+(ok?'cloud':'local');
  el.textContent=ok?t('status_cloud'):t('status_local');
  el.title='';
}
function loginMsg(m,neutral){const el=$('#loginMsg');if(!el)return;el.textContent=m||'';el.style.color=neutral?'var(--muted)':'var(--coral)';}
function showLogin(){const l=$('#login');if(l)l.classList.remove('hidden');}
function hideLogin(){const l=$('#login');if(l)l.classList.add('hidden');}

async function initDB(attempt){
  attempt=attempt||1;
  if(!USE_FIREBASE){setStatus(false);loginMsg(t('err_fb_load'));return;}
  // one of the SDK files may not have arrived (common on mobile data) → fetch it again
  if(window.__fbMissing&&window.__fbMissing().length){
    loginMsg(t('connecting'),true);
    const ok=await window.__fbReload();
    if(!ok){setStatus(false);showRetry(t('err_fb_load'));return;}
  }
  if(!window.firebase||typeof firebase.firestore!=='function'||typeof firebase.auth!=='function'){
    setStatus(false);showRetry(t('err_fb_load'));return;
  }
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    db=firebase.firestore(); auth=firebase.auth();
    try{ if(firebase.storage)storage=firebase.storage(); }catch(eS){ console.warn('storage unavailable',eS); }
    // keep working when the ward WiFi drops — writes queue locally and sync on reconnect
    try{ await db.enablePersistence({synchronizeTabs:true}); }
    catch(e0){ console.warn('offline cache unavailable:',e0&&e0.code); }
    // some mobile browsers (private mode) block IndexedDB → fall back so login still works
    try{ await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
    catch(e1){ try{ await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); }catch(e2){} }
    setStatus(true);
    loginMsg('');
    auth.onAuthStateChanged(handleAuth);
  }catch(e){
    console.error('Firebase init failed:',e);
    setStatus(false);
    if(attempt<2){setTimeout(()=>initDB(attempt+1),1200);return;}
    showRetry(t('err_server'));
  }
}
function showRetry(msg){
  loginMsg(msg);
  const box=$('#lg_retry');if(!box)return;
  box.innerHTML=`<button class="btn btn-outline btn-sm" onclick="retryConnect()">${t('btn_retry')}</button>`;
}
async function retryConnect(){
  const box=$('#lg_retry');if(box)box.innerHTML='';
  loginMsg(t('connecting'),true);
  await initDB(1);
}

/* runs on login/logout */
async function handleAuth(fbUser){
  if(!fbUser){USER=null;current='';ROUNDS=[];unsubscribeRounds();unsubscribeCounts();showLogin();return;}
  try{
    const snap=await db.collection(UC).doc(fbUser.uid).get();
    let prof=snap.exists?snap.data():null;
    if(!prof){
      let firstEver=false;
      try{ const any=await db.collection(UC).limit(1).get(); firstEver=any.empty; }
      catch(err){ loginMsg(t('err_unauth')); await auth.signOut(); return; }
      if(firstEver){ // first user ever → admin
        prof={name:(fbUser.email||'admin').split('@')[0],email:(fbUser.email||'').toLowerCase(),role:'admin',depts:['*'],createdAt:new Date().toISOString()};
        await db.collection(UC).doc(fbUser.uid).set(prof);
        toast(t('toast_admin_created'),'ok');
      }else{
        loginMsg(t('err_unauth'));
        await auth.signOut(); return;
      }
    }
    if(prof.active===false){ loginMsg(t('err_unauth')); await auth.signOut(); return; }
    USER={uid:fbUser.uid,email:fbUser.email,...prof};
    loginMsg(''); hideLogin(); subscribeRounds(); subscribeCounts(); boot();
  }catch(e){console.error(e);loginMsg(t('err_load_acct'));}
}

let roundsUnsubs=[];
const ROUNDS_BY_DEPT={};
function unsubscribeRounds(){
  roundsUnsubs.forEach(u=>{try{u();}catch(e){}});
  roundsUnsubs=[];roundsSubbed=false;
  for(const k in ROUNDS_BY_DEPT)delete ROUNDS_BY_DEPT[k];
}
function subscribeRounds(){
  if(roundsSubbed)return; roundsSubbed=true; cloud=true;
  const errH=e=>{console.error(e);toast(t('toast_cloud_lost'),'err');};
  const meta=snap=>{
    FROM_CACHE=!!(snap.metadata&&snap.metadata.fromCache);
    PENDING=snap.docs.filter(d=>d.metadata&&d.metadata.hasPendingWrites).length;
    setStatus(true);
  };
  if(seesAllDepts(USER)||isSupportDept(USER)){
    // full access (admin/director/sup-all) OR support dept (its queue can be on any ward) → one listener, no filter
    roundsUnsubs.push(db.collection(RC).onSnapshot(snap=>{meta(snap);onData(snap.docs.map(d=>d.data()));},errH));
  }else{
    // scoped roles → one listener per allowed department (matches security rules)
    const ds=userDepts(USER);
    ds.forEach(d=>{
      roundsUnsubs.push(db.collection(RC).where('dept','==',d).onSnapshot(snap=>{
        meta(snap);
        ROUNDS_BY_DEPT[d]=snap.docs.map(x=>x.data());
        const all=[];ds.forEach(k=>{(ROUNDS_BY_DEPT[k]||[]).forEach(r=>all.push(r));});
        onData(all);
      },errH));
    });
  }
}

function onData(rounds){
  ROUNDS=rounds.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  if(!USER)return;
  checkNewEscalations();
  buildTabs();
  const ae=document.activeElement;
  const typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName||'');
  if(current!=='new'&&current!=='users'&&!typing)render();
}

/* ===== escalation alerts for managers (in-system) ===== */
let ESC_SEEN=null;          // Set of escalated problem ids already known this session
let ESC_NEW=0;              // count of unseen new escalations (drives the pulsing badge)
function escKey(p){return p.id||((p.round&&p.round.id)+'|'+(p.qkey||''));}
function checkNewEscalations(){
  if(isSupportDept(USER)){checkNewSupport();return;}
  if(!canManageProblems(USER))return;              // only managers get alerts
  const cur=escalatedInScope();
  const curIds=cur.map(escKey);
  if(ESC_SEEN===null){                             // first load → seed silently, no alert
    ESC_SEEN=new Set(curIds); ESC_NEW=0; return;
  }
  const fresh=cur.filter(p=>{
    const k=escKey(p);
    if(ESC_SEEN.has(k))return false;
    ESC_SEEN.add(k);
    // don't alert the manager about an escalation they raised themselves
    return (p.escalatedBy||'')!==USER.name;
  });
  if(fresh.length){
    ESC_NEW+=fresh.length;
    notifyEscalation(fresh);
  }
}
function notifyEscalation(list){

  const one=list[0];
  const dep=one.round?deptLabel(one.round.dept):'';
  const more=list.length>1?t('esc_alert_more',{n:num(list.length-1)}):'';
  toast('🔔 '+t('esc_alert',{dept:dep})+more,'esc');
  showEscBanner(list.length);

  const cur=supportQueue().filter(p=>p.extStatus==='open');
  const curIds=cur.map(escKey);
  if(ESC_SEEN===null){ESC_SEEN=new Set(curIds);ESC_NEW=0;return;}
  const fresh=cur.filter(p=>{const k=escKey(p);if(ESC_SEEN.has(k))return false;ESC_SEEN.add(k);return true;});
  if(fresh.length){
    ESC_NEW+=fresh.length;
    playAlertSound();
    toast('🔔 '+t('sup_alert',{n:num(fresh.length)}),'esc');
    showEscBanner(fresh.length);
  }

function playAlertSound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    const ac=new AC();
    // two soft rising beeps
    [0,0.18].forEach((off,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine'; o.frequency.value=i?880:660;
      o.connect(g);g.connect(ac.destination);
      const s=ac.currentTime+off;
      g.gain.setValueAtTime(0,s);
      g.gain.linearRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,s+0.16);
      o.start(s);o.stop(s+0.17);
    });
  }catch(e){}
}

// normalize a phone to international digits for wa.me (default country = Saudi 966)
function normPhone(raw){
  let d=(raw||'').replace(/[^\d+]/g,'');
  if(!d)return '';
  if(d[0]==='+')d=d.slice(1);
  if(d.startsWith('00'))d=d.slice(2);
  if(d.startsWith('966'))return d;
  if(d[0]==='0')return '966'+d.slice(1);      // 05xxxxxxxx → 9665xxxxxxxx
  if(d.length===9&&d[0]==='5')return '966'+d;  // 5xxxxxxxx
  return d;                                    // already international / other country
}

function escStart(item){return item.escalatedTs||(item.round&&item.round.ts)||null;}
function ageDays(iso){ if(!iso)return null; return Math.floor((Date.now()-new Date(iso))/864e5); }

  const d=ageDays(escStart(item)); if(d==null)return '';

function hoursBetween(a,b){ if(!a||!b)return null; const h=(new Date(b)-new Date(a))/36e5; return h>=0?h:null; }
function fmtDur(h){

  });
}
function updateScaleDesc(qk){
  const el=$('#desc_'+qk);if(!el)return;
  const v=draft.ratings[qk];
  if(!v){el.innerHTML='<span class="hint">'+t('rubric_pick')+'</span>';return;}
  el.innerHTML=`<span class="ds-badge sel-${v}">${arNum(v)} · ${esc(scaleShort(qk,v))}</span> <span class="ds-long">${esc(scaleLong(qk,v))}</span>`;
}
function openRubric(qk){
  const rb=rubric(qk);if(!rb)return;
  const q=QRATED.find(x=>x.k===qk);
  const rows=[5,4,3,2,1].map(v=>`<div class="rub-row">
      <span class="rub-score sel-${v}">${arNum(v)}</span>
      <div><b>${esc(rb[v][0])}</b><div class="hint">${esc(rb[v][1])}</div></div>
    </div>`).join('');
  const html=`<div class="rub-modal-head"><b>${arNum(q.n)} · ${esc(qLabel(q))}</b>
      <button type="button" class="x" onclick="closeRubric()">✕</button></div>
    <div class="anchor" style="margin:0 0 12px">${esc(rb.anchor)}</div>${rows}`;
  let ov=$('#rubricOverlay');
  if(!ov){ov=document.createElement('div');ov.id='rubricOverlay';ov.className='rub-overlay';ov.onclick=e=>{if(e.target===ov)closeRubric();};document.body.appendChild(ov);}
  ov.innerHTML=`<div class="rub-box">${html}</div>`;ov.style.display='grid';
}
function closeRubric(){const ov=$('#rubricOverlay');if(ov)ov.style.display='none';}
function renderScale(target,key){
  const el=typeof target==='string'?$('#'+target):target;
  el.innerHTML='';
  const cur=draft.ratings[key];
  SCALE.forEach(s=>{
    const b=document.createElement('div');
    b.className='dot'+(cur===s.v?' sel-'+s.v:'');
    const short=(key!=='overall')?scaleShort(key,s.v):t('sc_'+s.v);
    b.innerHTML=`<span class="num">${arNum(s.v)}</span>${esc(short)}`;
    if(key!=='overall'&&short!==t('sc_'+s.v))b.title=t('sc_'+s.v)+' — '+scaleLong(key,s.v);
    b.onclick=()=>{draft.ratings[key]=s.v;if(key==='overall'){renderScale('overallScale','overall');}else{updateScaleDesc(key);renderScale(el,key);const qb=el.closest('.qblock');if(qb){qb.classList.toggle('flagged',s.v<=THRESHOLD);}}updateLive();};
    el.appendChild(b);
  });
}
function updateLive(){
  const avg=roundAvg(draft);
  const flagged=QRATED.filter(q=>draft.ratings[q.k]&&draft.ratings[q.k]<=THRESHOLD).length;
  const el=$('#liveScore');if(!el)return;
  if(avg==null){el.textContent=t('live_notstarted');return;}
  el.innerHTML=t('live_avg')+`: <b style="color:var(--ink)">${avg.toFixed(1)}/5 (${pct(avg)}%)</b>`+
    (flagged?` · <span style="color:var(--coral);font-weight:700">`+t('live_flagged',{n:arNum(flagged)})+`</span>`:' · '+t('live_noflag'));
}

/* ---- problems review step ---- */
function goProblems(){
  if(!draft.dept||!draft.room.trim()||!draft.ptype){toast(t('err_complete'),'err');return;}
  const answered=QRATED.filter(q=>draft.ratings[q.k]).length;
  if(answered<QRATED.length){toast(t('err_rateall'),'err');return;}
  // (re)build auto problems from low ratings, keep existing decisions
  const prev={};draft.problems.forEach(p=>{if(p.qkey)prev[p.qkey]=p;});
  draft.problems=[];
  QRATED.forEach(q=>{
    if(draft.ratings[q.k]<=THRESHOLD){
      const old=prev[q.k];
      draft.problems.push(old||{id:uid(),qkey:q.k,label:I18N.ar['q_'+q.k],score:draft.ratings[q.k],note:'',status:'open',actionTech:'',actionSup:'',escalatedTo:'',handledBy:''});
      // refresh score in case changed
      draft.problems[draft.problems.length-1].score=draft.ratings[q.k];
    }
  });
  renderProblemStep();
}
function renderProblemStep(){
  const app=$('#app');
  const probs=draft.problems;
  app.innerHTML=`
  <div class="page-head">
    <div><h2>${t('ps_title')}</h2><p>${esc(deptLabel(draft.dept))} · ${t('room_word')} ${esc(draft.room)} · ${esc(ptypeLabel(draft.ptype))}</p></div>
    <button class="btn btn-outline btn-sm" onclick="viewNew()">${t('back_eval')}</button>
  </div>`;

  if(!probs.length){
    app.innerHTML+=`<div class="card card-pad"><div class="empty">
      <div class="ic">✅</div><h3>${t('no_issues_title')}</h3>
      <p>${t('no_issues_sub')}</p>
      <button class="btn btn-primary" style="margin-top:14px" onclick="commitRound()">${t('save_round')}</button>
    </div></div>`;
    return;
  }

  let html='<div class="card card-pad">';
  html+=`<div class="hint" style="margin-bottom:16px">`+t('ps_intro',{n:'<b style="color:var(--coral)">'+arNum(probs.length)+'</b>'})+`</div>`;
  probs.forEach((p,i)=>{
    html+=`<div class="prob" id="prob_${p.id}">
      <div class="prob-head">
        <span class="pill">${arNum(i+1)}</span>
        <span class="prob-src">${esc(probLabel(p))}</span>
        <span class="tag">${t('rating_word')}: ${arNum(p.score)}/5</span>
        <div style="flex:1"></div>
        <span class="status ${statusClass(p.status)}">${statusLabel(p.status)}</span>
      </div>
      <div class="prob-body">
        <label class="fld">${t('f_probdesc')}</label>
        <textarea data-f="note" data-id="${p.id}" placeholder="${t('f_probdesc_ph')}">${esc(p.note)}</textarea>
        <div class="choice">
          <button class="btn ${p.status==='resolved'?'btn-green':'btn-outline'} btn-sm" onclick="chooseResolve('${p.id}')">${t('btn_resolved_now')}</button>
          <button class="btn ${p.status==='escalated'?'btn-coral':'btn-outline'} btn-sm" onclick="chooseEscalate('${p.id}')">${t('btn_escalate')}</button>
        </div>
        <div id="detail_${p.id}" style="margin-top:12px"></div>
      </div>
    </div>`;
  });
  html+=`<div class="divider"></div>
    <div class="row-between">
      <div class="hint" id="probSummary"></div>
      <button class="btn btn-primary" onclick="commitRound()">${t('save_round')}</button>
    </div></div>`;
  app.innerHTML+=html;

  probs.forEach(p=>renderProbDetail(p));
  document.querySelectorAll('[data-f=note]').forEach(t=>t.oninput=e=>{
    const p=draft.problems.find(x=>x.id===e.target.dataset.id);p.note=e.target.value;
  });
  updateProbSummary();
}
function statusClass(s){return s==='resolved'?'st-res':s==='escalated'?'st-esc':'st-open';}
async function deleteRound(id){
  if(!canDeleteRounds(USER)){toast(t('err_noperm_delete'),'err');return;}
  const r=ROUNDS.find(x=>x.id===id);if(!r)return;
  const who=`${deptLabel(r.dept)} · ${t('room_word')} ${r.room} · ${fmtDate(r.ts)}`;
  if(!confirm(t('confirm_delete_round',{info:who})))return;
  const ok=await DB.remove(id);
  if(ok){toast(t('toast_round_deleted'),'ok');current='all';render();}

function statusLabel(s){return s==='resolved'?t('st_resolved'):s==='escalated'?t('st_escalated'):t('st_open');}
function renderProbDetail(p){
  const box=$('#detail_'+p.id);if(!box)return;
  if(p.status==='resolved'){
    box.innerHTML=`<div style="background:var(--green-soft);border-radius:11px;padding:13px 15px">
      <label class="fld" style="color:#146b48">${t('ap_resolved_label')}</label>

  }else if(p.status==='escalated'){
    box.innerHTML=`<div style="background:var(--amber-soft);border-radius:11px;padding:13px 15px">
      <label class="fld" style="color:#8a5f0e">${t('esc_reason_label')}</label>
      <textarea data-f="escalatedTo" data-id="${p.id}" placeholder="${t('esc_reason_ph')}">${esc(p.escalatedTo)}</textarea>
      <div id="tphoto_${p.id}" style="margin-top:8px">${p.photo?`<img src="${esc(p.photo)}" class="ev-photo" alt=""><button type="button" class="btn btn-outline btn-sm" style="margin-inline-start:8px" onclick="clearTechPhoto('${p.id}')">${t('photo_remove')}</button>`:''}</div>
      ${p.photo?'':`<label class="photo-btn" for="tfile_${p.id}">📷 ${t('photo_add')}</label>
      <input type="file" id="tfile_${p.id}" accept="image/*" capture="environment" style="display:none" onchange="onTechPhoto('${p.id}',this)">`}

  box.querySelectorAll('textarea').forEach(t=>t.oninput=e=>{

  });

function chooseResolve(id){const p=draft.problems.find(x=>x.id===id);p.status='resolved';p.escalatedTo='';refreshProb(p);}
function chooseEscalate(id){const p=draft.problems.find(x=>x.id===id);p.status='escalated';p.actionTech='';refreshProb(p);}
function refreshProb(p){
  const card=$('#prob_'+p.id);
  card.querySelector('.status').className='status '+statusClass(p.status);
  card.querySelector('.status').textContent=statusLabel(p.status);
  const btns=card.querySelectorAll('.choice .btn');
  btns[0].className='btn '+(p.status==='resolved'?'btn-green':'btn-outline')+' btn-sm';
  btns[1].className='btn '+(p.status==='escalated'?'btn-coral':'btn-outline')+' btn-sm';
  renderProbDetail(p);updateProbSummary();
}
function updateProbSummary(){
  const el=$('#probSummary');if(!el)return;
  const undecided=draft.problems.filter(p=>p.status==='open').length;
  const res=draft.problems.filter(p=>p.status==='resolved').length;
  const esc2=draft.problems.filter(p=>p.status==='escalated').length;
  el.innerHTML=t('sum_resolved')+`: <b style="color:var(--green)">${arNum(res)}</b> · `+t('sum_escalated')+`: <b style="color:var(--amber)">${arNum(esc2)}</b>`+
    (undecided?` · <span style="color:var(--coral)">`+t('sum_remaining',{n:arNum(undecided)})+`</span>`:'');
}
async function commitRound(){
  const undecided=draft.problems.filter(p=>p.status==='open').length;
  if(undecided){toast(t('err_decide'),'err');return;}
  const rid=uid();
  // finalize resolved problems metadata + upload any attached photos to Storage
  for(const p of draft.problems){
    if(p.status==='resolved'){p.handledBy=USER.name;p.resolvedTs=new Date().toISOString();}
    if(p.status==='escalated'){p.escalatedBy=USER.name;p.escalatedTs=new Date().toISOString();}
    if(p.photo&&/^data:/.test(p.photo)){
      try{p.photo=await uploadPhoto(p.photo,'escalations/'+rid+'/'+p.id);}catch(e){/* keep inline */}
    }
  }
  const round={
    id:rid,ts:new Date().toISOString(),
    dept:draft.dept,room:draft.room.trim(),pname:(draft.pname||'').trim(),mrn:(draft.mrn||'').trim(),ptype:draft.ptype,tech:USER.name,techUid:USER.uid||'',techTitle:USER.title||'',
    ratings:{...draft.ratings},liked:draft.liked.trim(),suggestions:draft.suggestions.trim(),nurse:draft.nurse.trim(),
    problems:draft.problems
  };
  DB.save(round);
  const esc2=draft.problems.filter(p=>p.status==='escalated').length;
  draft=null;
  toast(t('toast_saved')+(esc2?t('toast_saved_esc',{n:arNum(esc2)}):''),'ok');
  current='myrounds';render();
}

function viewMyRounds(){roundsList(scopedRounds(),t('mr_title'),t('mr_sub'));}
let monthFilter='all'; // 'all' or 'YYYY-MM'
function monthKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function monthLabel(key){
  if(key==='all')return t('month_all');
  const [y,m]=key.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString(dloc(),{month:'long',year:'numeric'});
}
function availableMonths(list){
  const set=new Set(list.map(r=>monthKey(r.ts)));
  return [...set].sort().reverse();
}
function applyMonth(list){
  return monthFilter==='all'?list:list.filter(r=>monthKey(r.ts)===monthFilter);
}
function viewAll(){
  const scoped=scopedRounds();
  const filtered=applyMonth(scoped);

/* ================= PROBLEMS (managers) ================= */
function viewProblems(){
  clearEscNew();
  const app=$('#app');
  const all=scopedProblems();
  const pending=all.filter(p=>p.status==='escalated')
    .sort((a,b)=>new Date(escStart(a)||0)-new Date(escStart(b)||0));   // oldest first
  const done=all.filter(p=>p.status==='resolved');
  const overdue=pending.filter(p=>{const d=ageDays(escStart(p));return d!=null&&d>=ESC_CRIT_D;});
  const oldest=pending.length?ageDays(escStart(pending[0])):null;
  app.innerHTML=`<div class="page-head"><div><h2>${t('pr_title')}</h2>
    <p>${t('pr_sub')}</p></div></div>`;

  const respAvg=(()=>{const v=done.map(p=>hoursBetween(escStart(p),p.resolvedTs)).filter(x=>x!=null);
    return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;})();
  app.innerHTML+=`<div class="kpis" style="margin-bottom:22px">
    <div class="kpi warn"><div class="lbl">${t('kpi_needaction')}</div><div class="val">${num(pending.length)}</div><div class="sub">${t('kpi_escalated')}</div></div>
    <div class="kpi${overdue.length?' danger':''}"><div class="lbl">${t('age_overdue')}</div>
      <div class="val">${num(overdue.length)}</div>
      <div class="sub">${t('sec_overdue',{n:num(ESC_CRIT_D)})}</div></div>
    <div class="kpi"><div class="lbl">${t('age_oldest')}</div><div class="val" style="font-size:20px">${oldest==null?'—':ageLabel(oldest)}</div><div class="sub">${t('kpi_escalated')}</div></div>
    <div class="kpi good"><div class="lbl">${t('kpi_resptime')}</div><div class="val" style="font-size:20px">${respAvg==null?'—':fmtDur(respAvg)}</div><div class="sub">${respAvg==null?t('no_resp'):t('resp_sub')}</div></div>
  </div>`;

  app.innerHTML+=`<div class="section-title">${t('sec_needaction',{n:num(pending.length)})}</div>`;
  if(!pending.length){app.innerHTML+=emptyCard('✅',t('no_esc_title'),t('no_esc_sub'));}
  else{
    let html='';
    pending.forEach(item=>{

/* Post-resolution satisfaction re-check: one question, replaces the original score for that item. */
const RECHECK={5:{k:'satisfied',emoji:'😊'},3:{k:'neutral',emoji:'😐'},1:{k:'unsatisfied',emoji:'🙁'}};
function canRecheck(u){return !!u&&['tech','head','sup','admin'].includes(u.role);}
function recheckHTML(item,r){
  if(item.status!=='resolved')return '';
  // already re-checked → show the result
  if(item.recheck){
    const rc=RECHECK[item.recheck.score]||RECHECK[3];
    return `<div style="background:var(--teal-soft);border-radius:10px;padding:10px 13px;margin-top:8px">
      <b style="color:var(--ink)">${t('rc_done_label')}:</b> ${rc.emoji} ${t('rc_'+rc.k)}
      <span class="tag" style="margin-inline-start:8px">${t('rc_newscore')}: ${arNum(item.recheck.score)}/5</span>
      <div class="hint">${t('by_word')} ${esc(item.recheck.by||'')}${item.recheck.role?' · '+roleLabel(item.recheck.role):''}</div></div>`;
  }
  if(!canRecheck(USER))return '';
  // prompt for the re-check
  return `<div style="background:#fff;border:1.5px dashed var(--teal);border-radius:10px;padding:11px 13px;margin-top:8px">
    <div style="font-weight:700;color:var(--ink);margin-bottom:8px">${t('rc_prompt')}</div>
    <div class="seg" style="gap:7px">
      <button type="button" class="seg-opt rc-opt" onclick="doRecheck('${r.id}','${item.id}',5)">😊 ${t('rc_satisfied')}</button>
      <button type="button" class="seg-opt rc-opt" onclick="doRecheck('${r.id}','${item.id}',3)">😐 ${t('rc_neutral')}</button>
      <button type="button" class="seg-opt rc-opt" onclick="doRecheck('${r.id}','${item.id}',1)">🙁 ${t('rc_unsatisfied')}</button>
    </div></div>`;
}
function doRecheck(roundId,probId,score){
  if(!canRecheck(USER)){toast(t('err_noperm_recheck'),'err');return;}
  const r=ROUNDS.find(x=>x.id===roundId);if(!r)return;
  const p=r.problems.find(x=>x.id===probId);if(!p)return;
  p.recheck={score,by:USER.name,role:USER.role,ts:new Date().toISOString(),prevScore:(p.qkey&&r.ratings[p.qkey])||null};
  // the new satisfaction replaces the original rating for that question
  if(p.qkey&&r.ratings){r.ratings[p.qkey]=score;}
  DB.save(r);toast(t('rc_saved'),'ok');render();
}
function resolveProblem(roundId,probId){
  if(!canManageProblems(USER)){toast(t('err_noperm_close'),'err');return;}
  const plan=$('#sup_'+probId).value.trim();
  if(!plan){toast(t('err_write_plan'),'err');return;}
  const r=ROUNDS.find(x=>x.id===roundId);if(!r)return;
  const p=r.problems.find(x=>x.id===probId);if(!p)return;
  p.actionSup=plan;p.supName=USER.name;p.supRole=USER.role;p.status='resolved';p.resolvedTs=new Date().toISOString();
  DB.save(r);toast(t('toast_issue_closed'),'ok');render();
}

// all problems routed to the current support user's dept
function supportQueue(){
  if(!isSupportDept(USER))return [];
  const mine=USER.supportDept;
  const out=[];
  ROUNDS.forEach(r=>{(r.problems||[]).forEach(p=>{
    if(p.extDept===mine && p.extStatus && p.extStatus!=='returned'){
      out.push(Object.assign({},p,{round:r}));
    }
  });});
  // open first (needs action), then closed
  return out.sort((a,b)=>{
    const ao=a.extStatus==='open'?0:1, bo=b.extStatus==='open'?0:1;
    if(ao!==bo)return ao-bo;
    return new Date(b.extTs||0)-new Date(a.extTs||0);
  });
}

async function supportResolve(roundId,probId){
  if(!isSupportDept(USER)){toast(t('err_noperm'),'err');return;}
  const plan=$('#sp_'+probId).value.trim();
  if(!plan){toast(t('err_write_plan'),'err');return;}
  const r=ROUNDS.find(x=>x.id===roundId);if(!r)return;

  p.extPlan=plan;p.extName=USER.name;p.extTs2=new Date().toISOString();p.extStatus='closed';
  if(supPhotoBuf[probId]){
    let ph=supPhotoBuf[probId];
    if(/^data:/.test(ph)){try{ph=await uploadPhoto(ph,'ext_resolutions/'+roundId+'/'+probId);}catch(e){}}
    p.extPhoto=ph;delete supPhotoBuf[probId];
  }
  // closing externally also resolves the underlying problem for nursing views
  p.status='resolved';p.resolvedTs=p.resolvedTs||new Date().toISOString();
  p.actionSup=p.actionSup||(t('ext_resolved_by_support',{d:supportLabel(p.extDept)})+' — '+plan);
  p.supName=p.supName||USER.name;p.supRole=p.supRole||'support';
  DB.save(r);toast(t('sup_closed_ok'),'ok');render();
}

// compress an image File to a JPEG data URL (fallback storage when Firebase Storage isn't wired)
function compressImage(file,maxDim=1280,quality=.72){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
      else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
// turn a data URL into a Blob for Storage upload
function dataURLtoBlob(dataURL){
  const [head,body]=dataURL.split(',');
  const mime=(head.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(body);const len=bin.length;const arr=new Uint8Array(len);
  for(let i=0;i<len;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
/* Upload a compressed image to Firebase Storage and return its download URL.
   Falls back to the inline data URL when Storage isn't available (offline/local mode),
   so photos always work — they just live in the DB instead of Storage in that case. */
async function uploadPhoto(dataURL,pathPrefix){
  if(!(storage&&cloud))return dataURL;   // local/offline → keep inline
  try{
    const blob=dataURLtoBlob(dataURL);
    const name=pathPrefix+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
    const ref=storage.ref().child(name);
    await ref.put(blob,{contentType:'image/jpeg'});
    return await ref.getDownloadURL();
  }catch(e){
    console.warn('photo upload failed, keeping inline',e);
    return dataURL;   // graceful fallback
  }
}

/* ================= DASHBOARD ================= */
/* patient counts: only رئيس القسم enters them; coverage = rounds / (total - excluded) */
function canEditCounts(u){return !!u&&u.role==='head';}
function todayKey(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function countsInRange(dept,start,end){
  return Object.values(PCOUNTS).filter(c=>c.dept===dept&&(()=>{const t=new Date(c.date+'T12:00:00');return t>=start&&t<=end;})());
}
function coverageFor(rounds,dept,start,end){
  // sum patient counts across the period for the given dept(s)
  const depts=dept==='all'?userDepts(USER):[dept];
  let total=0,excluded=0,haveCounts=false;
  depts.forEach(d=>countsInRange(d,start,end).forEach(c=>{total+=(+c.total||0);excluded+=(+c.excluded||0);haveCounts=true;}));
  const eligible=Math.max(0,total-excluded);
  const pct=eligible>0?Math.round(rounds.length/eligible*100):null;
  return {total,excluded,eligible,rounds:rounds.length,pct,haveCounts};
}
let pcEditDate=null; // date being edited in the entry panel
/* a past day that already has a recorded total is locked (view-only);
   the current day, and past days that were forgotten (no record), stay editable */
function countLocked(dept,date){
  const existing=PCOUNTS[countId(dept,date)]||{};
  return date<todayKey() && existing.total!=null;
}
function patientCountPanel(dept){
  if(!canEditCounts(USER))return '';
  const d=dept==='all'?USER.dept:dept;
  const date=pcEditDate||todayKey();
  const existing=PCOUNTS[countId(d,date)]||{};
  const locked=countLocked(d,date);

/* bar chart per question vs target line */
function questionBars(rounds){
  if(!rounds.length)return '<div class="hint">'+t('no_rounds_period')+'</div>';
  const tg=SAT_TARGET/100*5;
  return QRATED.map((q,i)=>{
    const vals=rounds.map(r=>(r.ratings||{})[q.k]).filter(v=>v);
    const a=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:0;
    const below=a<tg;
    const col=below?'var(--coral)':'var(--green)';
    const lb=qLabel(q);
    return `<div class="qbar"><div class="qbar-top"><span>${below?'<span style="color:var(--coral)">▼</span> ':''}${esc(lb.length>42?lb.slice(0,42)+'…':lb)}</span><span class="sc" style="color:${col}">${a.toFixed(1)}</span></div>
      <div class="track" style="position:relative"><div class="fill" style="width:${a/5*100}%;background:${col}"></div>
        <div style="position:absolute;top:-2px;bottom:-2px;inset-inline-start:${tg/5*100}%;width:2px;background:#33486B" title="${t('radar_target',{tg:num(SAT_TARGET)})}"></div>
      </div></div>`;
  }).join('');
}

function cssEsc(s){return (s||'').replace(/["\\]/g,'\\$&');}

/* collect all the numbers the report needs for the chosen period + depts */
function buildReportData(){
  const depts = isMultiDept(USER)? repDepts.slice() : [USER.dept];
  let data=scopedRounds().filter(r=>depts.includes(r.dept));
  const buckets=makeBuckets(repPeriod,data);
  const cur=buckets[buckets.length-1]||{rounds:[]};
  const curRounds=cur.rounds||[];
  const probs=[];curRounds.forEach(r=>(r.problems||[]).forEach(p=>probs.push(p)));
  const resolved=probs.filter(p=>p.status==='resolved').length;
  const avg=periodAvg(curRounds);
  const satPct=avg?pct(avg):null;
  const resRate=probs.length?Math.round(resolved/probs.length*100):null;
  const respVals=probs.filter(p=>p.status==='resolved').map(p=>hoursBetween(escStart(p),p.resolvedTs)).filter(x=>x!=null);
  const respAvg=respVals.length?respVals.reduce((a,b)=>a+b,0)/respVals.length:null;
  // coverage across the period, summed over chosen depts
  let cov=null;
  if(cur.start&&cur.end){
    let total=0,excluded=0,have=false;
    depts.forEach(d=>countsInRange(d,cur.start,cur.end).forEach(c=>{total+=(+c.total||0);excluded+=(+c.excluded||0);have=true;}));
    const eligible=Math.max(0,total-excluded);
    cov={pct:eligible>0?Math.round(curRounds.length/eligible*100):null,have,eligible,rounds:curRounds.length};
  }
  // per-question averages (scope = current period, fallback all)
  const scope=curRounds.length?curRounds:data;
  const qstats=QRATED.map(q=>{
    const vals=scope.map(r=>r.ratings&&r.ratings[q.k]).filter(v=>v);
    const a=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:0;
    return {k:q.k,label:qLabel(q),avg:a};
  });
  // recurring problems
  const rmap={};
  scope.forEach(r=>(r.problems||[]).forEach(p=>{
    const k=r.dept+'||'+(p.qkey||'');
    if(!rmap[k])rmap[k]={dept:r.dept,qkey:p.qkey,n:0,open:0};
    rmap[k].n++; if(p.status!=='resolved')rmap[k].open++;
  }));
  const recurring=Object.values(rmap).filter(x=>x.n>=REPEAT_MIN).sort((a,b)=>b.n-a.n);
  return {depts,periodLabel:periodLabel(repPeriod),rangeLabel:cur.label||'',
    satAvg:avg,satPct,rounds:curRounds.length,cov,issues:probs.length,resolved,resRate,respAvg,
    qstats,recurring,hasData:data.length>0};
}

function generateReport(){
  if(isMultiDept(USER)&&repDepts.length===0){toast(t('rep_pick_dept'),'err');return;}
  const R=buildReportData();
  closeReportDialog();
  if(!R.hasData){toast(t('rep_no_data'),'err');return;}
  const html=reportHTML(R);
  const w=window.open('','_blank');
  if(!w){toast(t('rep_no_data'),'err');return;} // popup blocked
  w.document.open();w.document.write(html);w.document.close();
}

  const curRounds=cur?cur.rounds:[];
  const probs=[];curRounds.forEach(r=>r.problems.forEach(p=>probs.push(p)));
  const resolved=probs.filter(p=>p.status==='resolved').length;
  const escc=probs.filter(p=>p.status==='escalated').length;

  const respVals=probs.filter(p=>p.status==='resolved').map(p=>hoursBetween(escStart(p),p.resolvedTs)).filter(x=>x!=null);
  const respAvg=respVals.length?respVals.reduce((a,b)=>a+b,0)/respVals.length:null;

  const curBucket=cur||{};

      <div class="sub">${satPct==null?t('no_rounds_word'):t('sat_vs_target',{n:num(satPct),tg:num(SAT_TARGET),mark:hitTarget?'✔':'▼'})}</div></div>
    <div class="kpi"><div class="lbl">${t('kpi_roundscount')}</div><div class="val">${num(curRounds.length)}</div><div class="sub">${t('in_current_period')}</div></div>
    <div class="kpi warn"><div class="lbl">${t('kpi_flagged_issues')}</div><div class="val">${num(probs.length)}</div><div class="sub">${t('open_word',{n:num(openc+escc)})}</div></div>

    <div class="kpi"><div class="lbl">${t('kpi_resptime')}</div><div class="val" style="font-size:21px">${respAvg==null?'—':fmtDur(respAvg)}</div><div class="sub">${respAvg==null?t('no_resp'):t('resp_sub')}</div></div>
    ${cov?`<div class="kpi ${cov.pct==null?'accent':cov.pct>=90?'good':cov.pct>=70?'warn':'danger'}"><div class="lbl">${t('kpi_coverage')}</div>
      <div class="val">${cov.pct==null?'—':num(cov.pct)+'%'}</div>
      <div class="sub">${cov.haveCounts?t('cov_sub',{r:num(cov.rounds),e:num(cov.eligible)}):t('cov_nodata')}</div></div>`:''}
  </div>`;

  // patient-count entry (رئيس القسم only)
  html+=patientCountPanel(isMultiDept(USER)?dashDept:USER.dept);

  // trend chart
  html+=`<div class="card card-pad" style="margin-bottom:20px">
    <div class="section-title" style="margin-top:0">${t('sec_trend')}</div>
    <div class="chartwrap"><div class="bars">${trendBars(buckets)}</div></div></div>`;

  // two columns
  html+=`<div class="grid2">`;
  // per-question strengths/weaknesses (over current period, fallback all)
  const scope=curRounds.length?curRounds:data;
  html+=`<div class="card card-pad"><div class="section-title" style="margin-top:0">${t('sec_strengths')}</div>${questionBars(scope)}</div>`;
  // problems + department breakdown
  html+=`<div class="card card-pad"><div class="section-title" style="margin-top:0">${t('sec_issue_status')}</div>
    ${probStatusBar(t('bar_resolved'),resolved,probs.length,'var(--green)')}

/* ---- same item failing again and again in one department = systemic ---- */
function recurringSection(rounds){
  const map={};
  rounds.forEach(r=>r.problems.forEach(p=>{
    const k=r.dept+'||'+(p.qkey||'');
    if(!map[k])map[k]={dept:r.dept,qkey:p.qkey,n:0,open:0};
    map[k].n++; if(p.status!=='resolved')map[k].open++;
  }));
  const rows=Object.values(map).filter(x=>x.n>=REPEAT_MIN).sort((a,b)=>b.n-a.n);
  let html=`<div class="card card-pad" style="margin-bottom:20px">
    <div class="section-title" style="margin-top:0">${t('sec_repeat')}</div>`;
  if(!rows.length){
    html+=`<p class="hint">${t('repeat_none',{n:num(REPEAT_MIN)})}</p></div>`;
    return html;
  }
  html+=`<p class="hint" style="margin-top:0">${t('repeat_hint',{n:num(REPEAT_MIN)})}</p>
    <div style="overflow-x:auto"><table><thead><tr><th>${t('th_dept')}</th><th>${t('xl_item')}</th><th>${t('repeat_count')}</th><th>${t('repeat_open')}</th></tr></thead><tbody>`;
  rows.forEach(x=>{
    const q=QRATED.find(q=>q.k===x.qkey);
    html+=`<tr><td><b>${esc(deptLabel(x.dept))}</b></td>
      <td>${esc(q?qLabel(q):(x.qkey||'—'))}</td>
      <td><span class="agechip crit">${num(x.n)}</span></td>
      <td>${x.open?'<span class="agechip warn">'+num(x.open)+'</span>':num(0)}</td></tr>`;
  });
  html+='</tbody></table></div></div>';
  return html;
}

const STOPWORDS=('في من على الى إلى عن مع كل ان أن ام أم او أو لا ما هو هي هم هن اللي التي الذي كان كانت يكون قد لم لن هذا هذه ذلك تلك بس بعد قبل عند لكن ثم و يا جدا جداً شي شيء الله and the for with was were they that this have has not you are but all very some'
).split(/\s+/);
function topWords(texts,limit){
  const c={};
  texts.join(' ').toLowerCase()
    .replace(/[ً-ٰٟ]/g,'')                 // strip Arabic diacritics
    .split(/[^ء-يa-z0-9]+/)
    .forEach(w=>{ if(w.length>2&&!STOPWORDS.includes(w))c[w]=(c[w]||0)+1; });
  return Object.entries(c).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,limit||8);
}
function probStatusBar(lbl,n,total,col){
  const p=total?n/total*100:0;
  return `<div class="qbar"><div class="qbar-top"><span>${lbl}</span><span class="sc">${num(n)}${total?' / '+num(total):''}</span></div>
    <div class="track"><div class="fill" style="width:${p}%;background:${col}"></div></div></div>`;
}
function questionAverages(rounds){
  if(!rounds.length)return '<div class="hint">'+t('no_rounds_period')+'</div>';
  return QRATED.map(q=>{
    const vals=rounds.map(r=>(r.ratings||{})[q.k]).filter(v=>v);

      <div class="track"><div class="fill" style="width:${a/5*100}%;background:${col}"></div></div></div>`;
  }).join('');
}
function deptBreakdown(){
  const rows=userDepts(USER).map(d=>({d,rs:scopedRounds().filter(r=>r.dept===d)})).filter(x=>x.rs.length).sort((a,b)=>b.rs.length-a.rs.length);
  if(!rows.length)return '<div class="hint">'+t('no_rounds_yet')+'</div>';
  const under=rows.filter(({rs})=>{const a=periodAvg(rs);return a!=null&&pct(a)<SAT_TARGET;}).length;

  return head+rows.map(({d,rs})=>{
    const a=periodAvg(rs);

    const below=p!=null&&p<SAT_TARGET;

      <span style="font-weight:700">${below?'<span style="color:var(--coral)">▼</span> ':''}${esc(deptLabel(d))}</span>

  }).join('');
}
function periodAvg(rounds){
  const avgs=rounds.map(roundAvg).filter(v=>v!=null);
  if(!avgs.length)return null;
  return avgs.reduce((a,b)=>a+b,0)/avgs.length;
}
function trendBars(buckets){
  const max=5;
  return buckets.map(b=>{
    const a=periodAvg(b.rounds);
    const h=a?(a/max*100):0;
    const col=a==null?'#dde6e7':a>=4?'linear-gradient(var(--green),#178a5b)':a>=3?'linear-gradient(var(--amber),#c98410)':'linear-gradient(var(--coral),#c23f28)';
    return `<div class="bar-col"><div class="bar" style="height:${h}%;background:${col}">${a?`<span>${a.toFixed(1)}</span>`:''}</div><div class="bar-lbl">${b.label}</div></div>`;
  }).join('');
}

/* ---- bucket generation ---- */
function dloc(){return LANG==='en'?'en-GB':'ar-SA-u-nu-latn';}
function makeBuckets(period,data){
  const now=new Date();const buckets=[];
  const cfg={daily:{n:14},weekly:{n:8},monthly:{n:6},quarterly:{n:4},yearly:{n:3}}[period];
  for(let i=cfg.n-1;i>=0;i--){
    let start,end,label;
    if(period==='daily'){
      const d=new Date(now);d.setDate(now.getDate()-i);d.setHours(0,0,0,0);
      start=new Date(d);end=new Date(d);end.setHours(23,59,59,999);
      label=d.toLocaleDateString(dloc(),{day:'numeric',month:'numeric'});
    }else if(period==='weekly'){
      const d=new Date(now);d.setDate(now.getDate()-i*7);const dow=d.getDay();
      start=new Date(d);start.setDate(d.getDate()-dow);start.setHours(0,0,0,0);
      end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);
      label=t('week_prefix')+' '+start.toLocaleDateString(dloc(),{day:'numeric',month:'numeric'});
    }else if(period==='monthly'){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      start=new Date(d);end=new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999);
      label=d.toLocaleDateString(dloc(),{month:'short',year:'2-digit'});
    }else if(period==='quarterly'){
      const q=Math.floor(now.getMonth()/3)-i;const yr=now.getFullYear()+Math.floor(q/4);const qi=((q%4)+4)%4;
      start=new Date(yr,qi*3,1);end=new Date(yr,qi*3+3,0,23,59,59,999);
      label=t('quarter_prefix')+(LANG==='en'?'':' ')+num(qi+1)+' '+num(String(yr).slice(2));
    }else{
      const yr=now.getFullYear()-i;start=new Date(yr,0,1);end=new Date(yr,11,31,23,59,59,999);
      label=num(yr);
    }
    const rounds=data.filter(r=>{const tt=new Date(r.ts);return tt>=start&&tt<=end;});
    buckets.push({label,rounds,start,end});
  }
  return buckets;
}
function periodLabel(p){return t('pl_'+p);}

function stRange(period){
  const now=new Date();let start,days;
  if(period==='daily'){start=new Date(now);start.setHours(0,0,0,0);days=1;}
  else if(period==='weekly'){start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);days=7;}
  else if(period==='monthly'){start=new Date(now.getFullYear(),now.getMonth(),1);days=Math.round((now-start)/864e5)+1;}
  else if(period==='quarterly'){const q=Math.floor(now.getMonth()/3);start=new Date(now.getFullYear(),q*3,1);days=Math.round((now-start)/864e5)+1;}
  else {start=new Date(now.getFullYear(),0,1);days=Math.round((now-start)/864e5)+1;}
  return {start,days:Math.max(1,days)};
}
function dayKey(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

function staffStats(){
  const {start}=stRange(stPeriod);
  let data=scopedRounds().filter(r=>new Date(r.ts)>=start);
  if(stDept!=='all')data=data.filter(r=>r.dept===stDept);
  const map={};
  const keyOf=r=>r.techUid||('name:'+(r.tech||'—'));
  data.forEach(r=>{
    const k=keyOf(r);
    if(!map[k])map[k]={key:k,name:r.tech||'—',title:r.techTitle||'',dept:r.dept,rounds:[],days:{},issues:0,res:0,esc:0};
    const m=map[k];
    m.rounds.push(r);m.dept=r.dept;
    if(r.techTitle)m.title=r.techTitle;   // newest round wins if the title changed
    m.days[dayKey(r.ts)]=(m.days[dayKey(r.ts)]||0)+1;
    m.issues+=r.problems.length;
    m.res+=r.problems.filter(p=>p.status==='resolved').length;
    m.esc+=r.problems.filter(p=>p.status==='escalated').length;
  });
  // staff in scope who recorded nothing this period
  STAFF.filter(u=>u.role==='tech'&&u.active!==false&&u.dept&&(stDept==='all'?userDepts(USER).includes(u.dept):u.dept===stDept))
    .forEach(u=>{ if(!map[u.uid]&&!Object.values(map).some(m=>m.name===u.name))
      map[u.uid]={key:u.uid,name:u.name||'—',title:u.title||'',dept:u.dept,rounds:[],days:{},issues:0,res:0,esc:0}; });
  // fill in titles from the staff directory for anyone whose rounds predate the field
  Object.values(map).forEach(m=>{ if(!m.title){
    const u=STAFF.find(x=>x.uid===m.key||x.name===m.name); if(u&&u.title)m.title=u.title; } });
  return Object.values(map).map(m=>{
    const dl=Object.keys(m.days).length;
    return {...m,n:m.rounds.length,activeDays:dl,
      perDay:dl?m.rounds.length/dl:0,
      avg:periodAvg(m.rounds),
      last:m.rounds.length?m.rounds.map(r=>r.ts).sort().slice(-1)[0]:null};
  }).sort((a,b)=>b.n-a.n||(a.name>b.name?1:-1));
}
